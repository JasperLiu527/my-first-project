<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>左膝康复 14 天</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="左膝康复">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: iOS-style app — large title per tab, inset grouped lists, fixed translucent tab bar, bottom sheets and a full-screen workout timer */
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --card-2: #f2f2f7;
  --fg: #000000;
  --fg-2: rgba(60, 60, 67, .6);
  --fg-3: rgba(60, 60, 67, .3);
  --sep: rgba(60, 60, 67, .22);
  --fill: rgba(120, 120, 128, .12);
  --fill-2: rgba(120, 120, 128, .2);
  --bar: rgba(249, 249, 249, .86);
  --blue: #007aff;
  --green: #34c759;
  --orange: #ff9500;
  --red: #ff3b30;
  --teal: #30b0c7;
  --dim: rgba(0, 0, 0, .35);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", "Noto Sans SC", sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --card: #1c1c1e; --card-2: #2c2c2e; --fg: #ffffff;
    --fg-2: rgba(235, 235, 245, .6); --fg-3: rgba(235, 235, 245, .3); --sep: rgba(84, 84, 88, .55);
    --fill: rgba(120, 120, 128, .24); --fill-2: rgba(120, 120, 128, .36); --bar: rgba(22, 22, 24, .86);
    --blue: #0a84ff; --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --teal: #40c8e0; --dim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 17px; line-height: 1.35; letter-spacing: -.01em; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
body.locked { overflow: hidden; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.r { font-family: var(--round); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

/* compact nav bar shown after scrolling past the large title */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 8; padding-top: env(safe-area-inset-top, 0px); background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: .5px solid var(--sep); opacity: 0; pointer-events: none; transition: opacity .2s; }
.nav.on { opacity: 1; pointer-events: auto; }
.nav div { height: 44px; display: grid; place-items: center; font-size: 17px; font-weight: 600; }

.wrap { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
.lt { padding-block: 20px 6px; display: grid; gap: 2px; }
.lt h1 { font-size: 34px; font-weight: 700; letter-spacing: .01em; }
.lt p { margin: 0; font-size: 15px; color: var(--fg-2); }
.view { display: grid; gap: 0; }

/* inset grouped list */
.gt { font-size: 13px; color: var(--fg-2); padding: 22px 16px 7px; letter-spacing: 0; }
.gt.big { font-size: 20px; font-weight: 700; color: var(--fg); padding: 26px 2px 8px; letter-spacing: .01em; }
.ft { font-size: 13px; color: var(--fg-2); padding: 7px 16px 0; line-height: 1.4; }
.group { background: var(--card); border-radius: 12px; overflow: hidden; }
.cell { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 11px 16px; position: relative; width: 100%; text-align: left; }
.cell + .cell::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); border-top: .5px solid var(--sep); }
.cell .main { flex: 1; min-width: 0; }
.cell .main .t { font-size: 17px; }
.cell .main .s { font-size: 13px; color: var(--fg-2); margin-top: 1px; }
.cell .val { color: var(--fg-2); font-size: 17px; white-space: nowrap; }
.cell.tap:active { background: var(--fill); }
.chev { width: 8px; height: 13px; flex: none; color: var(--fg-3); }
.ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; flex: none; color: #fff; }
.ico svg { width: 18px; height: 18px; }

/* switches and inputs */
.sw { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill-2); position: relative; flex: none; cursor: pointer; transition: background .2s; margin: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .2s; }
.sw:checked { background: var(--green); }
.sw:checked::after { transform: translateX(20px); }
.pick { font: inherit; font-size: 17px; color: var(--fg); background: var(--fill); border: 0; border-radius: 8px; padding: 5px 10px; min-height: 34px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { height: 30px; border-radius: 7px; font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); font-weight: 600; }
@media (prefers-color-scheme: dark) { .seg button[aria-pressed="true"] { background: #636366; } }
textarea { width: 100%; min-height: 72px; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 17px; resize: vertical; padding: 0; }
textarea::placeholder { color: var(--fg-3); }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px; border-radius: 12px; background: var(--blue); color: #fff; font-size: 17px; font-weight: 600; }
.btn:active { opacity: .8; }
.btn.tint { background: color-mix(in srgb, var(--blue) 15%, transparent); color: var(--blue); }
.btn.green { background: var(--green); }
.lnk { color: var(--blue); font-size: 17px; }
.lnk.red { color: var(--red); }

/* today: hero */
.hero { background: var(--card); border-radius: 16px; padding: 16px; display: grid; gap: 14px; }
.hero-top { display: flex; gap: 16px; align-items: center; }
.rings { width: 92px; height: 92px; flex: none; }
.hero-txt { flex: 1; min-width: 0; display: grid; gap: 6px; }
.hero-txt .k { font-size: 13px; color: var(--fg-2); font-weight: 600; letter-spacing: .02em; }
.legend { display: grid; gap: 3px; font-size: 15px; }
.legend b { font-family: var(--round); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.legend .a { color: var(--green); }
.legend .p { color: var(--teal); }

/* week strip */
.strip { display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 2px 10px; scrollbar-width: none; margin-inline: -2px; }
.strip::-webkit-scrollbar { display: none; }
.dc { flex: 0 0 calc((100% - 36px) / 7); scroll-snap-align: start; display: grid; justify-items: center; gap: 4px; padding: 6px 0 8px; border-radius: 12px; }
.dc .w { font-size: 11px; color: var(--fg-2); font-weight: 600; }
.dc .n { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; font-family: var(--round); font-weight: 600; font-size: 17px; position: relative; }
.dc .n svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.dc .d { font-size: 10px; color: var(--fg-3); }
.dc.sel { background: var(--card); }
.dc.sel .n { color: var(--blue); }
.dc.today .w { color: var(--red); }
.dc.future { opacity: .55; }
.phase-row { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 2px 6px; gap: 8px; }
.phase-row h2 { font-size: 20px; font-weight: 700; }
.phase-row span { font-size: 13px; color: var(--fg-2); }

/* exercise rows */
.ex { --inset: 104px; }
.thumb { width: 76px; height: 50px; border-radius: 9px; background: var(--card-2); flex: none; display: grid; place-items: center; color: var(--fg); }
.thumb svg { width: 70px; height: 44px; }
.prog { display: flex; align-items: center; gap: 6px; font-family: var(--round); font-size: 15px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.chk { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--fg-3); display: grid; place-items: center; flex: none; }
.chk.on { background: var(--green); border-color: var(--green); color: #fff; }
.chk.part { border-color: var(--orange); background: conic-gradient(var(--orange) var(--p), transparent 0); }
.chk svg { width: 14px; height: 14px; }

.note { border-radius: 12px; padding: 12px 14px; font-size: 15px; display: flex; gap: 10px; align-items: flex-start; background: var(--card); }
.note svg { width: 22px; height: 22px; flex: none; margin-top: 1px; }
.note .bd { flex: 1; min-width: 0; display: grid; gap: 6px; }
.note b { font-weight: 600; }
.note.warn svg { color: var(--orange); }
.note.bad svg { color: var(--red); }
.note.ok svg { color: var(--green); }
.note.info svg { color: var(--blue); }
.stack { display: grid; gap: 10px; margin-top: 12px; }

/* pain scale */
.pain { padding: 14px 16px 16px; display: grid; gap: 10px; }
.pain-head { display: flex; justify-content: space-between; align-items: baseline; }
.pain-head .big { font-family: var(--round); font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.pain-head .lab { font-size: 15px; color: var(--fg-2); }
.scale { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; }
.scale button { height: 36px; border-radius: 8px; background: var(--fill); font-family: var(--round); font-size: 15px; font-weight: 600; color: var(--fg-2); }
.scale button.on { color: #fff; }
.scale button.on.g { background: var(--green); }
.scale button.on.y { background: var(--orange); }
.scale button.on.r { background: var(--red); }
.scale-cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg-2); }

/* plan */
.pill { font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.pill.part { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
.pill.none { background: var(--fill); color: var(--fg-2); }
.pill.fut { color: var(--fg-3); }
.daynum { width: 36px; height: 36px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; font-family: var(--round); font-weight: 700; font-size: 17px; flex: none; }
.daynum.now { background: var(--blue); color: #fff; }

/* trends */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--card); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
.tile .k { font-size: 13px; font-weight: 600; }
.tile .v { font-family: var(--round); font-size: 34px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 17px; color: var(--fg-2); font-weight: 600; }
.tile .s { font-size: 12px; color: var(--fg-2); }
.chart-card { background: var(--card); border-radius: 14px; padding: 14px 14px 10px; display: grid; gap: 4px; }
.chart-card .k { font-size: 13px; font-weight: 600; color: var(--fg-2); }
.chart-card .t { font-size: 22px; font-weight: 700; }
.chart { width: 100%; height: auto; display: block; margin-top: 6px; }

/* guide */
.avoid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--sep); }
.avoid div { background: var(--card); padding: 14px 6px; text-align: center; font-size: 15px; display: grid; justify-items: center; gap: 4px; }
.avoid svg { width: 22px; height: 22px; color: var(--red); }
.bullet { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex: none; }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px max(4px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
.tabs button { display: grid; justify-items: center; gap: 2px; padding: 1px 0 2px; font-size: 10px; font-weight: 500; color: #999; letter-spacing: 0; }
.tabs svg { width: 26px; height: 26px; }
.tabs button[aria-selected="true"] { color: var(--blue); }

/* bottom sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--dim); opacity: 0; transition: opacity .25s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 600px; margin: 0 auto; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); overflow-y: auto; background: var(--bg); border-radius: 14px 14px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.sheet.on { transform: none; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--fg-3); margin: 0 auto 6px; }
.sheet-bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 0 10px; }
.sheet-bar h2 { font-size: 17px; font-weight: 600; }
.sheet-bar button { color: var(--blue); font-weight: 600; font-size: 17px; }
.illo { background: var(--card); border-radius: 14px; display: grid; place-items: center; padding: 12px; color: var(--fg); }
.illo svg { width: 100%; max-width: 320px; height: auto; }
.steps { margin: 0; padding: 0; list-style: none; }
.sn { width: 24px; height: 24px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; font-family: var(--round); font-size: 13px; font-weight: 700; flex: none; }

/* workout timer */
.timer { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; padding: calc(10px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
.timer-top { display: flex; justify-content: space-between; align-items: center; min-height: 44px; gap: 12px; }
.timer-top .ex-name { font-size: 17px; font-weight: 600; }
.timer-top .ex-sub { font-size: 13px; color: var(--fg-2); }
.timer-mid { display: grid; place-items: center; align-content: center; gap: 18px; text-align: center; }
.cue { font-size: 28px; font-weight: 700; min-height: 1.3em; }
.dial { position: relative; width: min(72vw, 300px); aspect-ratio: 1; max-width: 100%; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--round); font-weight: 300; font-size: 92px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.track { stroke: var(--fill); }
.arc { stroke: var(--blue); transition: stroke-dashoffset .3s linear; }
.timer.rest .arc { stroke: var(--green); }
.timer.prep .arc { stroke: var(--orange); }
.timer.rest .cue { color: var(--green); }
.timer.prep .cue { color: var(--orange); }
.tl { font-size: 17px; color: var(--fg-2); }
.tl b { font-family: var(--round); color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; max-width: 280px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--fill-2); }
.dots i.on { background: var(--blue); }
.ctrls { display: flex; justify-content: space-between; align-items: center; }
.circ { width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 500; position: relative; }
.circ::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 2px solid var(--bg); }
.circ.grey { background: var(--fill-2); }
.circ.go { background: color-mix(in srgb, var(--green) 25%, transparent); color: var(--green); }
.circ.pause { background: color-mix(in srgb, var(--orange) 25%, transparent); color: var(--orange); }
.skip { color: var(--blue); font-size: 17px; padding: 10px; }

.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: rgba(40,40,40,.92); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 15px; max-width: calc(100% - 40px); text-align: center; }

@media (prefers-reduced-motion: reduce) { .sheet, .scrim, .arc, .nav, .sw, .sw::after { transition: none; } }
</style>
</head>
<body>

<div class="nav" id="nav" aria-hidden="true"><div id="navTitle">今天</div></div>

<main class="wrap">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-plan" hidden></section>
  <section class="view" id="v-trend" hidden></section>
  <section class="view" id="v-guide" hidden></section>
  <section class="view" id="v-set" hidden></section>
</main>

<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="13" cy="13" r="10"></circle><circle cx="13" cy="13" r="5.5"></circle></svg>今天</button>
  <button role="tab" data-tab="plan" aria-selected="false"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="19" height="17" rx="3"></rect><path d="M3.5 10.5h19M9 3v4M17 3v4"></path></svg>计划</button>
  <button role="tab" data-tab="trend" aria-selected="false"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l6-6 4 4 9-9"></path><path d="M16 7h6v6"></path></svg>趋势</button>
  <button role="tab" data-tab="guide" aria-selected="false"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 3l8.5 3.5v6c0 5-3.6 8.6-8.5 10.5C8.1 21.1 4.5 17.5 4.5 12.5v-6z"></path><path d="M13 9v5M13 17.5v.2"></path></svg>须知</button>
  <button role="tab" data-tab="set" aria-selected="false"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="13" cy="13" r="3.5"></circle><path d="M13 2.5v3M13 20.5v3M2.5 13h3M20.5 13h3M5.6 5.6l2.1 2.1M18.3 18.3l2.1 2.1M5.6 20.4l2.1-2.1M18.3 7.7l2.1-2.1"></path></svg>设置</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>

<div class="timer" id="timer" hidden role="dialog" aria-modal="true" aria-label="跟练计时">
  <div class="timer-top">
    <div><div class="ex-name" id="tName">跟练</div><div class="ex-sub" id="tSub"></div></div>
    <button class="skip" id="tSkip">跳过</button>
  </div>
  <div class="timer-mid">
    <div class="cue" id="tCue">准备</div>
    <div class="dial">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" class="track" stroke-width="5"></circle><circle id="tArc" cx="50" cy="50" r="45" fill="none" class="arc" stroke-width="5" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="0"></circle></svg>
      <div class="count" id="tCount">5</div>
    </div>
    <div class="tl" id="tLine"></div>
    <div class="dots" id="tDots"></div>
  </div>
  <div class="ctrls">
    <button class="circ grey" id="tStop">结束</button>
    <button class="circ pause" id="tPause">暂停</button>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
  "use strict";
  // ---------- illustrations (simple line pictograms, 120×72) ----------
  const fig = body => `<svg viewBox="0 0 120 72" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="66" x2="116" y2="66" stroke-width="2" opacity=".25"></line>${body}</svg>`;
  const up = (x, y) => `<path d="M${x} ${y + 12}V${y}M${x - 4} ${y + 4}l4-4 4 4" stroke="var(--blue)" stroke-width="2.4"></path>`;
  const ILLO = {
    quad: fig(`<circle cx="14" cy="55" r="5.5"></circle><path d="M21 58H54L98 58l2-8"></path><ellipse cx="76" cy="62" rx="7" ry="3.5" stroke="var(--teal)" stroke-width="2.4"></ellipse><path d="M76 34v12M72 42l4 4 4-4" stroke="var(--blue)" stroke-width="2.4"></path>`),

    side: fig(`<circle cx="14" cy="50" r="5.5"></circle><path d="M14 56l6 6"></path><path d="M21 54L54 58L100 60"></path><path d="M54 56L98 38"></path>${up(106, 22)}`),

  // ---------- plan data ----------
  const EX = {
    quad:  { name: "股四头肌等长收缩", short: "绷紧大腿，膝盖下压",
             steps: ["仰卧，左膝下垫一个毛巾卷", "绷紧大腿前侧肌肉，把膝盖向下压向毛巾", "保持 5 秒，然后放松 5 秒"],
             phases: [["绷紧，膝盖下压", 5, "work"], ["放松", 5, "rest"]] },
    slr:   { name: "仰卧直腿抬高", short: "膝盖伸直，抬高 20–30 cm",
             steps: ["仰卧，右腿屈膝踩地支撑", "左腿先绷紧大腿，保持膝盖伸直", "缓慢抬高 20–30 cm，顶端停留 1 秒", "缓慢放下，不要让腿掉下来"],
             phases: [["绷紧大腿，慢慢抬起", 3, "work"], ["顶端停留", 1, "work"], ["缓慢放下", 3, "work"], ["休息", 2, "rest"]] },
    side:  { name: "侧卧抬腿（臀中肌）", short: "侧卧，控制抬起不晃动",
             steps: ["右侧卧，左腿在上，膝盖伸直", "脚尖朝前，用臀部侧面发力", "缓慢抬高 20–30 cm，停留 1 秒", "控制着放下，身体不前后晃动"],
             phases: [["慢慢抬起", 3, "work"], ["停留", 1, "work"], ["缓慢放下", 3, "work"], ["休息", 2, "rest"]] },
    heel:  { name: "脚跟滑动屈膝", short: "舒适范围内屈伸",
             steps: ["仰卧，双腿伸直", "左脚跟沿床面缓慢滑向臀部", "到舒适位置后再慢慢滑回伸直", "不要强行深屈，不痛为准"],
             phases: [["脚跟滑向臀部", 4, "work"], ["慢慢伸直", 4, "work"], ["休息", 2, "rest"]] },
    bridge:{ name: "桥式（臀部）", short: "臀部发力抬起",
             steps: ["仰卧屈膝，双脚与髋同宽踩地", "臀部发力，抬起到肩、髋、膝一条线", "顶端停留 2 秒", "缓慢放下"],
             phases: [["臀部发力抬起", 2, "work"], ["顶端停留", 2, "work"], ["缓慢放下", 3, "work"], ["休息", 2, "rest"]] },
    sts:   { name: "高椅坐站", short: "控制膝盖方向，慢起慢坐",
             steps: ["选择较高的椅子，双脚与肩同宽", "身体前倾，慢慢站起", "再慢慢坐下，膝盖对准脚尖方向", "如疼痛明显，减少次数或暂停"],
             phases: [["慢慢站起", 3, "work"], ["慢慢坐下", 4, "work"], ["休息", 3, "rest"]] },
    walk:  { name: "平地慢走", short: "正常步幅，不加重疼痛",
             steps: ["在平地上慢走 5–10 分钟", "保持正常步幅，不要拖步", "如果疼痛或肿胀加重就停下"], timed: true }
  };
  const PHASES = [
    { key: 1, title: "基础激活", time: "每天 10–15 分钟", range: "第 1–7 天",
      desc: "以低负荷为主，恢复肌肉激活和关节活动度，让膝盖适应运动，不增加疼痛。",
      list: [["quad", 10, 2, "10 次 × 2 组"], ["slr", 8, 2, "8 次 × 2 组"], ["side", 10, 2, "10 次 × 2 组"], ["heel", 10, 1, "10 次 × 1 组"]] },
    { key: 2, title: "力量提升", time: "每天 15–20 分钟", range: "第 8–14 天",
      desc: "在第 1 周没有明显加重疼痛的前提下，逐步增加训练量，加入轻度负重动作。",
      list: [["quad", 10, 2, "10 次 × 2 组"], ["slr", 10, 2, "10–12 次 × 2 组"], ["side", 10, 2, "10–12 次 × 2 组"],
             ["bridge", 10, 2, "10 次 × 2 组"], ["sts", 5, 2, "5–8 次 × 1–2 组"], ["walk", 5, 1, "5–10 分钟"]] }
  ];

  // ---------- dates ----------
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const utc = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  const diffDays = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
  const WD = "日一二三四五六";
  const fmt = s => { const d = parse(s); return `${d.getMonth() + 1}月${d.getDate()}日 周${WD[d.getDay()]}`; };
  const todayStr = () => ymd(new Date());

  // ---------- state (same storage key as v1, so earlier records carry over) ----------
  const LS = "knee14.v1";
  const DEFAULTS = { voice: true, rest: 30, remindOn: true, remindTime: "20:00", checkOn: true, checkTime: "09:00" };
  let state = { start: todayStr(), log: {}, stayPhase1: false, updatedAt: 0, settings: {} };
  try { const s = JSON.parse(localStorage.getItem(LS) || "null"); if (s && s.start) state = Object.assign(state, s); } catch (e) {}
  state.settings = Object.assign({}, DEFAULTS, state.settings || {});
  const S = state.settings;

  const realDay = () => diffDays(state.start, todayStr()) + 1;
  const clampDay = n => Math.min(14, Math.max(1, n));
  let viewDay = clampDay(realDay());
  let tab = "today";

  const dateOf = n => addDays(state.start, n - 1);
  const peek = n => state.log[dateOf(n)];
  const entry = n => state.log[dateOf(n)] || (state.log[dateOf(n)] = { sets: {}, pain: null, swell: false, worse: false, note: "" });
  const flagged = e => !!e && ((e.pain ?? 0) > 2 || e.swell || e.worse);
  const week1Flag = () => { for (let i = 1; i <= 7; i++) if (flagged(peek(i))) return true; return false; };
  const phaseFor = n => (n >= 8 && !state.stayPhase1) ? PHASES[1] : PHASES[0];
  function completion(n) {
    const e = peek(n), p = phaseFor(n);
    const total = p.list.reduce((a, x) => a + x[2], 0);
    const done = e ? p.list.reduce((a, [k, , sets]) => a + Math.min(sets, e.sets[k] || 0), 0) : 0;
    return { done, total, pct: total ? done / total : 0 };
  }
  function save() {
    state.updatedAt = Date.now();
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const zone = v => v <= 2 ? "g" : v <= 4 ? "y" : "r";
  const CHEV = `<svg class="chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5l5 5-5 5"></path></svg>`;
  const CHECK = `<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5l2.6 2.6L11 4.6"></path></svg>`;
  const I = {
    warn: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.7 0 1.3.4 1.7 1l8.4 15c.7 1.3-.2 3-1.7 3H3.6c-1.5 0-2.4-1.7-1.7-3l8.4-15c.4-.6 1-1 1.7-1zm0 6a1.2 1.2 0 0 0-1.2 1.3l.3 4.6a.9.9 0 0 0 1.8 0l.3-4.6A1.2 1.2 0 0 0 12 8.5zm0 8.2a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"></path></svg>`,
    info: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 8.2c-.6 0-1 .4-1 1v5.6a1 1 0 0 0 2 0v-5.6c0-.6-.4-1-1-1zm0-4a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"></path></svg>`,
    ok: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm4.3 6.3a1 1 0 0 0-1.4 0l-4.2 4.6-1.6-1.6a1 1 0 1 0-1.4 1.4l2.3 2.3a1 1 0 0 0 1.5 0l4.9-5.3a1 1 0 0 0-.1-1.4z"></path></svg>`,
    bell: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5a6.5 6.5 0 0 1 6.5 6.5v3.6l1.6 3a1 1 0 0 1-.9 1.4H4.8a1 1 0 0 1-.9-1.4l1.6-3V9A6.5 6.5 0 0 1 12 2.5zm-2.6 16h5.2a2.6 2.6 0 0 1-5.2 0z"></path></svg>`,
    cal: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2.5a1 1 0 0 1 1 1V5h8V3.5a1 1 0 1 1 2 0V5h.5A2.5 2.5 0 0 1 21 7.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5v-11A2.5 2.5 0 0 1 5.5 5H6V3.5a1 1 0 0 1 1-1zM5 10v8.5c0 .3.2.5.5.5h13c.3 0 .5-.2.5-.5V10z"></path></svg>`,
    speak: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 4.5v15a1 1 0 0 1-1.7.7L5.6 16.5H3.5A1.5 1.5 0 0 1 2 15V9a1.5 1.5 0 0 1 1.5-1.5h2.1l3.7-3.7a1 1 0 0 1 1.7.7zm4.6 3a1 1 0 0 1 1.4 0 6.4 6.4 0 0 1 0 9 1 1 0 1 1-1.4-1.4 4.4 4.4 0 0 0 0-6.2 1 1 0 0 1 0-1.4z"></path></svg>`,
    timer: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 1.5h6a1 1 0 1 1 0 2h-2v1.1a8.5 8.5 0 1 1-2 0V3.5H9a1 1 0 0 1 0-2zm3 6a1 1 0 0 0-1 1V13a1 1 0 0 0 .4.8l2.5 1.9a1 1 0 0 0 1.2-1.6L13 12.5v-4a1 1 0 0 0-1-1z"></path></svg>`,
    box: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm0 6.5h16V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm5 2.5a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2z"></path></svg>`,
    trash: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.5 2.5h5a1 1 0 0 1 1 1V5H20a1 1 0 1 1 0 2h-1l-.9 12.6a2.5 2.5 0 0 1-2.5 2.4H8.4a2.5 2.5 0 0 1-2.5-2.4L5 7H4a1 1 0 0 1 0-2h4.5V3.5a1 1 0 0 1 1-1z"></path></svg>`,
    x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>`,
    play: `<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.9l12-7.4a1 1 0 0 0 0-1.8l-12-7.4A1 1 0 0 0 7 4.6z"></path></svg>`
  };
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600);
  }
  function ringSvg(size, rings) {
    // rings: [{pct, color, r, w}]
    const c = size / 2;
    return `<svg viewBox="0 0 ${size} ${size}" class="rings" aria-hidden="true">${rings.map(g => {
      const L = 2 * Math.PI * g.r;
      return `<circle cx="${c}" cy="${c}" r="${g.r}" fill="none" stroke="${g.color}" stroke-opacity=".22" stroke-width="${g.w}"></circle>
        <circle cx="${c}" cy="${c}" r="${g.r}" fill="none" stroke="${g.color}" stroke-width="${g.w}" stroke-linecap="round" stroke-dasharray="${L.toFixed(2)}" stroke-dashoffset="${(L * (1 - Math.min(1, g.pct))).toFixed(2)}" transform="rotate(-90 ${c} ${c})" ${g.pct <= 0 ? 'stroke-opacity="0"' : ""}></circle>`;
    }).join("")}</svg>`;
  }

  // ---------- TODAY ----------
  function renderToday() {
    const rd = realDay(), p = phaseFor(viewDay), e = entry(viewDay), c = completion(viewDay);
    const isToday = viewDay === rd;
    let h = `<header class="lt"><h1>${isToday ? "今天" : `第 ${viewDay} 天`}</h1><p>${fmt(dateOf(viewDay))} · 第 ${viewDay} 天 / 共 14 天</p></header>`;

    // week strip (all 14 days, scrolls horizontally)
    h += `<div class="strip" id="strip">`;
    for (let n = 1; n <= 14; n++) {
      const cc = completion(n), d = parse(dateOf(n));
      const L = 2 * Math.PI * 15;
      const col = cc.pct >= 1 ? "var(--green)" : "var(--orange)";
      h += `<button class="dc${n === viewDay ? " sel" : ""}${n === rd ? " today" : ""}${n > rd ? " future" : ""}" data-act="day" data-n="${n}" aria-label="第${n}天">
        <span class="w">${n === rd ? "今天" : "周" + WD[d.getDay()]}</span>
        <span class="n">${cc.pct > 0 ? `<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="${L.toFixed(1)}" stroke-dashoffset="${(L * (1 - cc.pct)).toFixed(1)}"></circle></svg>` : ""}${n}</span>
        <span class="d">${d.getMonth() + 1}/${d.getDate()}</span></button>`;
    }
    h += `</div>`;

    // hero summary
    const painDone = e.pain != null ? 1 : 0;
    h += `<div class="hero"><div class="hero-top">
        ${ringSvg(92, [{ pct: c.pct, color: "var(--green)", r: 39, w: 11 }, { pct: painDone, color: "var(--teal)", r: 25, w: 11 }])}
        <div class="hero-txt"><div class="k">${p.range} · ${p.title}阶段</div>
          <div class="legend"><div class="a">训练 <b>${c.done}/${c.total}</b> 组</div><div class="p">疼痛记录 <b>${painDone ? e.pain + "/10" : "未记录"}</b></div></div>
        </div></div>
        ${c.pct >= 1 ? `<button class="btn tint" data-act="jump-pain">今天已完成，记录疼痛</button>` : `<button class="btn" data-act="all">${I.play}${c.done ? "继续今天的训练" : "开始今天的训练"}</button>`}
      </div>`;

    // notices
    const notes = [];
    const now = new Date(), [rh, rm] = S.remindTime.split(":").map(Number);
    if (isToday && c.pct < 1 && S.remindOn && (now.getHours() * 60 + now.getMinutes()) >= rh * 60 + rm)
      notes.push(`<div class="note info">${I.bell}<div class="bd"><div><b>该训练了。</b>今天还剩 ${c.total - c.done} 组，大约 ${p.key === 1 ? "10" : "15"} 分钟。</div></div></div>`);
    if (viewDay >= 8 && week1Flag() && !state.stayPhase1)
      notes.push(`<div class="note warn">${I.warn}<div class="bd"><div><b>第 1 周有疼痛超过 2 分或肿胀的记录。</b>计划要求第 1 周没有明显加重才进入力量阶段。</div><button class="lnk" style="justify-self:start" data-act="stay1">改为继续做第 1 阶段动作</button></div></div>`);
    else if (state.stayPhase1 && viewDay >= 8)
      notes.push(`<div class="note ok">${I.ok}<div class="bd"><div>正在继续做第 1 阶段动作，等膝盖稳定后再进阶。</div><button class="lnk" style="justify-self:start" data-act="go2">切换到力量提升阶段</button></div></div>`);
    const y = viewDay > 1 ? peek(viewDay - 1) : null;
    if (flagged(y))
      notes.push(`<div class="note warn">${I.warn}<div class="bd"><div><b>前一天疼痛 ${y.pain ?? "—"}/10${y.swell ? "，有肿胀" : ""}${y.worse ? "，比前天更痛" : ""}。</b>今天请降低负荷：减少次数或组数，动作幅度放小。</div></div></div>`);
    if (notes.length) h += `<div class="stack">${notes.join("")}</div>`;

    // exercises
    h += `<div class="phase-row"><h2>训练动作</h2><span>${p.time}</span></div><div class="group">`;
    p.list.forEach(([k, , sets, dose], i) => {
      const ex = EX[k], n = Math.min(sets, e.sets[k] || 0);
      const st = n >= sets ? `<span class="chk on">${CHECK}</span>` : n > 0 ? `<span class="chk part" style="--p:${(n / sets * 100).toFixed(0)}%"></span>` : `<span class="chk"></span>`;
      h += `<button class="cell tap ex" data-act="ex" data-i="${i}"><span class="thumb">${ILLO[k]}</span>
        <span class="main"><span class="t" style="display:block">${ex.name}</span><span class="s" style="display:block">${dose}</span></span>
        <span class="prog">${ex.timed ? "" : `${n}/${sets}`}${st}</span></button>`;
    });
    h += `</div><div class="ft">点动作查看做法和打卡；点上方按钮按顺序语音跟练。</div>`;

    // pain
    const pv = e.pain;
    const painMsg = pv == null ? "训练后选择疼痛分数" : pv <= 2 ? "在目标范围内，保持" : pv <= 4 ? "超过 2 分：明天减少次数或组数" : "疼痛偏高：明天只做最轻松的动作，持续请就医";
    h += `<div class="gt" id="painAnchor">训练后感受</div><div class="group">
      <div class="pain"><div class="pain-head"><span class="lab">疼痛评分</span><span class="big" style="color:${pv == null ? "var(--fg-3)" : pv <= 2 ? "var(--green)" : pv <= 4 ? "var(--orange)" : "var(--red)"}">${pv == null ? "–" : pv}<small style="font-size:17px;color:var(--fg-2)"> /10</small></span></div>
        <div class="scale">${Array.from({ length: 11 }, (_, v) => `<button class="${pv === v ? "on " : ""}${zone(v)}" data-act="pain" data-v="${v}" aria-pressed="${pv === v}" aria-label="疼痛 ${v} 分">${v}</button>`).join("")}</div>
        <div class="scale-cap"><span>不痛</span><span>中等</span><span>剧痛</span></div>
        <div style="font-size:15px;color:${pv != null && pv > 2 ? (pv > 4 ? "var(--red)" : "var(--orange)") : "var(--fg-2)"}">${painMsg}</div></div>
      <label class="cell"><span class="main">出现肿胀</span><input type="checkbox" class="sw" id="swell" ${e.swell ? "checked" : ""}></label>
      <label class="cell"><span class="main">比前一天更痛</span><input type="checkbox" class="sw" id="worse" ${e.worse ? "checked" : ""}></label>
      <div class="cell"><textarea id="note" rows="2" placeholder="备注：上楼感觉、哪个动作不舒服…">${esc(e.note || "")}</textarea></div>
    </div><div class="ft">目标：疼痛控制在 0–2 分，训练后或第二天不加重。</div>`;

    $("v-today").innerHTML = h;
    $("swell").onchange = ev => { entry(viewDay).swell = ev.target.checked; save(); renderToday(); };
    $("worse").onchange = ev => { entry(viewDay).worse = ev.target.checked; save(); renderToday(); };
    $("note").oninput = ev => { entry(viewDay).note = ev.target.value; save(); };
    const sel = $("strip").querySelector(".sel");
    if (sel) $("strip").scrollLeft = Math.max(0, sel.offsetLeft - $("strip").clientWidth / 2 + sel.clientWidth / 2);
  }

  // ---------- PLAN ----------
  function renderPlan() {
    const rd = realDay();
    let h = `<header class="lt"><h1>14 天计划</h1><p>目标：减轻疼痛、增强膝关节稳定性、恢复日常活动能力</p></header>`;
    PHASES.forEach((p, pi) => {
      const a = pi ? 8 : 1;
      h += `<div class="gt big">${p.range} · ${p.title}</div><div class="group" style="--inset:64px">`;
      for (let n = a; n < a + 7; n++) {
        const c = completion(n), e = peek(n);
        const pill = n > rd ? `<span class="pill fut">未开始</span>` : c.pct >= 1 ? `<span class="pill ok">已完成</span>` : c.done ? `<span class="pill part">${c.done}/${c.total} 组</span>` : `<span class="pill none">未训练</span>`;
        h += `<button class="cell tap" data-act="open" data-n="${n}"><span class="daynum${n === rd ? " now" : ""}">${n}</span>
          <span class="main"><span class="t" style="display:block">${fmt(dateOf(n))}${n === rd ? " · 今天" : ""}</span><span class="s" style="display:block">${phaseFor(n).list.length} 个动作${e && e.pain != null ? ` · 疼痛 ${e.pain}/10` : ""}${e && e.swell ? " · 肿胀" : ""}</span></span>${pill}${CHEV}</button>`;
      }
      h += `</div><div class="ft">${p.time}。${p.desc}</div>`;
      h += `<div class="gt">本阶段动作</div><div class="group ex">`;
      p.list.forEach(([k, , , dose]) => { h += `<div class="cell"><span class="thumb">${ILLO[k]}</span><span class="main"><span class="t" style="display:block">${EX[k].name}</span><span class="s" style="display:block">${dose} · ${EX[k].short}</span></span></div>`; });
      h += `</div>`;
    });
    $("v-plan").innerHTML = h;
  }

  // ---------- TRENDS ----------
  function renderTrend() {
    const rd = clampDay(realDay());
    let full = 0, pains = [], over = 0, streak = 0;
    for (let n = 1; n <= 14; n++) {
      const c = completion(n); if (c.pct >= 1) full++;
      const e = peek(n); if (e && e.pain != null) { pains.push(e.pain); if (e.pain > 2) over++; }
    }
    for (let n = rd; n >= 1; n--) { const c = completion(n); if (c.done > 0) streak++; else if (n === rd) continue; else break; }
    const avg = pains.length ? (pains.reduce((a, b) => a + b, 0) / pains.length).toFixed(1) : "–";
    const last = pains.length ? pains[pains.length - 1] : null;

    const W = 340, H = 190, L = 24, R = 10, T = 12, B = 46, cw = (W - L - R) / 13;
    const x = n => L + cw * (n - 1), y = v => T + (H - T - B) * (1 - v / 10);
    let g = `<rect x="${L}" y="${y(2)}" width="${W - L - R}" height="${y(0) - y(2)}" fill="var(--green)" fill-opacity=".12"></rect>`;
    [0, 2, 5, 10].forEach(v => { g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--sep)" stroke-width="1"></line><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--fg-2)">${v}</text>`; });
    const pts = [];
    for (let n = 1; n <= 14; n++) { const e = peek(n); if (e && e.pain != null) pts.push([n, e.pain]); }
    if (pts.length > 1) g += `<polyline points="${pts.map(([n, v]) => `${x(n).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--blue)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></polyline>`;
    pts.forEach(([n, v]) => { g += `<circle cx="${x(n).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4.5" fill="${v <= 2 ? "var(--green)" : v <= 4 ? "var(--orange)" : "var(--red)"}" stroke="var(--card)" stroke-width="2"></circle>`; });
    for (let n = 1; n <= 14; n++) {
      const c = completion(n);
      const col = n > rd ? "var(--fill)" : c.pct >= 1 ? "var(--green)" : c.done ? "var(--orange)" : "var(--fill-2)";
      g += `<rect x="${(x(n) - 7).toFixed(1)}" y="${H - 36}" width="14" height="10" rx="3" fill="${col}"></rect>`;
      g += `<text x="${x(n).toFixed(1)}" y="${H - 12}" text-anchor="middle" font-size="10" fill="${n === rd ? "var(--red)" : "var(--fg-2)"}" font-weight="${n === rd ? 700 : 400}">${n}</text>`;
    }

    let h = `<header class="lt"><h1>趋势</h1><p>第 1–14 天的训练和疼痛</p></header>
    <div class="tiles" style="margin-top:8px">
      <div class="tile"><div class="k" style="color:var(--green)">完成天数</div><div class="v r">${full}<small> /14</small></div><div class="s">整天的组数都做完</div></div>
      <div class="tile"><div class="k" style="color:var(--orange)">连续训练</div><div class="v r">${streak}<small> 天</small></div><div class="s">到今天为止</div></div>
      <div class="tile"><div class="k" style="color:var(--teal)">平均疼痛</div><div class="v r">${avg}<small> /10</small></div><div class="s">${pains.length} 天有记录</div></div>
      <div class="tile"><div class="k" style="color:var(--red)">超过 2 分</div><div class="v r">${over}<small> 天</small></div><div class="s">目标是 0 天</div></div>
    </div>
    <div class="gt"></div>
    <div class="chart-card"><div class="k">训练后疼痛</div><div class="t">${last == null ? "还没有记录" : `最近一次 ${last}/10`}</div>
      <svg class="chart r" viewBox="0 0 ${W} ${H}" role="img" aria-label="14 天疼痛折线图和每日完成情况">${g}</svg>
      <div class="ft" style="padding:2px 0 4px">绿色区域是目标 0–2 分。下方方块：绿色完成，橙色部分完成，灰色未训练。</div>
    </div>`;
    $("v-trend").innerHTML = h;
  }

    const bad = t => `<div class="cell" style="--inset:36px"><span class="bullet"></span><span class="main">${t}</span></div>`;

      <div class="ft">本 App 内容整理自你的康复计划，不替代医生或康复师的意见。</div>`;

      </div><div class="ft">记录只保存在这台 iPhone 上。删除主屏幕图标或清除 Safari 网站数据会丢失记录，建议偶尔导出备份。</div>

    $("startDate").onchange = ev => { if (!ev.target.value) return; state.start = ev.target.value; viewDay = clampDay(realDay()); save(); renderSet(); };
    ["remindOn", "checkOn", "voice"].forEach(id => $(id).onchange = ev => { S[id] = ev.target.checked; save(); renderSet(); });
    ["remindTime", "checkTime"].forEach(id => $(id).onchange = ev => { if (ev.target.value) { S[id] = ev.target.value; save(); } });

  // ---------- calendar reminders (.ics) ----------
  function buildICS() {
    const first = Math.max(1, realDay()), lastDate = dateOf(14);
    if (first > 14) return null;
    const firstDate = dateOf(first);
    const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    const url = location.href.split("#")[0];
    const ev = (uid, time, title, desc) => {
      const [hh, mm] = time.split(":");
      const d = firstDate.replace(/-/g, "");
      return ["BEGIN:VEVENT", `UID:${uid}-${d}@knee14`, `DTSTAMP:${stamp}`, `DTSTART:${d}T${hh}${mm}00`, "DURATION:PT15M",
        `RRULE:FREQ=DAILY;UNTIL=${lastDate.replace(/-/g, "")}T235959`, `SUMMARY:${title}`, `DESCRIPTION:${desc}`, `URL:${url}`,
        "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${title}`, "TRIGGER:PT0M", "END:VALARM", "END:VEVENT"].join("\r\n");
    };
    const evs = [];
    if (S.remindOn) evs.push(ev("train", S.remindTime, "左膝康复训练", "打开「左膝康复」App 完成今天的训练，并记录训练后疼痛。疼痛控制在 0–2 分。"));
    if (S.checkOn) evs.push(ev("check", S.checkTime, "检查左膝：疼痛和肿胀有没有加重？", "如果比昨天更痛或出现肿胀，在 App 里记录，今天降低训练负荷。"));
    return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//knee14//CN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:左膝康复", ...evs, "END:VCALENDAR"].join("\r\n");
  }
  function addToCalendar() {
    const ics = buildICS();
    if (!ics) return toast("14 天计划已经结束");
    location.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
  }

  // ---------- backup ----------
  async function exportData() {
    const json = JSON.stringify(state);
    const name = `左膝康复备份-${todayStr()}.json`;
    try {
      const file = new File([json], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(json); toast("备份已复制，可以粘贴到备忘录保存"); }
    catch (e) { openSheet("导出备份", `<div class="group"><div class="cell"><textarea readonly rows="8" style="font-size:13px">${esc(json)}</textarea></div></div><div class="ft">长按全选并复制，保存到备忘录。</div>`); }
  }
  function importSheet() {
    openSheet("从备份恢复", `<div class="group"><div class="cell"><textarea id="impText" rows="7" placeholder="粘贴之前导出的备份内容" style="font-size:13px"></textarea></div></div>
      <div class="ft">也可以选择备份文件：</div><div class="group" style="margin-top:6px"><label class="cell tap"><span class="main lnk">选择文件…</span><input type="file" id="impFile" accept="application/json,.json,text/plain" hidden></label></div>
      <div style="margin-top:16px"><button class="btn" data-act="import-go">恢复，覆盖当前记录</button></div>`);
    $("impFile").onchange = ev => { const f = ev.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => $("impText").value = r.result; r.readAsText(f); };
  }
  function importGo() {
    try {
      const s = JSON.parse($("impText").value);
      if (!s || typeof s.start !== "string" || typeof s.log !== "object") throw 0;
      state = Object.assign({ log: {}, stayPhase1: false, settings: {} }, s);
      state.settings = Object.assign({}, DEFAULTS, state.settings || {});
      Object.assign(S, state.settings); state.settings = S;
      viewDay = clampDay(realDay()); save(); closeSheet(); renderAll(); toast("已恢复");
    } catch (e) { toast("内容不是有效的备份，请检查后再试"); }
  }

  // ---------- sheet ----------
  function openSheet(title, body) {
    const sh = $("sheet"), sc = $("scrim");
    sh.innerHTML = `<div class="grab"></div><div class="sheet-bar"><span style="width:44px"></span><h2>${title}</h2><button data-act="close">完成</button></div>${body}`;
    sh.hidden = false; sc.hidden = false; document.body.classList.add("locked");
    requestAnimationFrame(() => { sh.classList.add("on"); sc.classList.add("on"); });
  }
  function closeSheet() {
    const sh = $("sheet"), sc = $("scrim");
    sh.classList.remove("on"); sc.classList.remove("on"); document.body.classList.remove("locked");
    setTimeout(() => { if (!sh.classList.contains("on")) { sh.hidden = true; sc.hidden = true; } }, 300);
  }
  function exSheet(i) {
    const p = phaseFor(viewDay), [k, , sets, dose] = p.list[i], ex = EX[k], e = entry(viewDay), n = Math.min(sets, e.sets[k] || 0);
    openSheet(ex.name, `<div class="illo">${ILLO[k]}</div>
      <div class="gt">${dose} · 每天</div><div class="group" style="--inset:52px"><ol class="steps">${ex.steps.map((s, j) => `<li class="cell"><span class="sn">${j + 1}</span><span class="main">${s}</span></li>`).join("")}</ol></div>
      <div class="gt">打卡</div><div class="group" style="--inset:16px">${Array.from({ length: sets }, (_, s) => `<button class="cell tap" data-act="set" data-k="${k}" data-s="${s}" data-i="${i}"><span class="main">${ex.timed ? "已完成" : `第 ${s + 1} 组`}</span><span class="chk${s < n ? " on" : ""}">${s < n ? CHECK : ""}</span></button>`).join("")}</div>
      <div style="margin-top:16px"><button class="btn" data-act="train" data-i="${i}">${I.play}${ex.timed ? "开始计时" : "开始跟练"}</button></div>`);
  }

  // ---------- tabs & render ----------
  const TITLES = { today: "今天", plan: "14 天计划", trend: "趋势", guide: "须知", set: "设置" };
  function renderAll() {
    ({ today: renderToday, plan: renderPlan, trend: renderTrend, guide: renderGuide, set: renderSet })[tab]();
    $("navTitle").textContent = tab === "today" && viewDay !== realDay() ? `第 ${viewDay} 天` : TITLES[tab];
  }
  function setTab(t) {
    tab = t;
    document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
    Object.keys(TITLES).forEach(v => $("v-" + v).hidden = v !== t);
    renderAll(); window.scrollTo(0, 0); onScroll();
  }
  function onScroll() { $("nav").classList.toggle("on", window.scrollY > 44); }
  window.addEventListener("scroll", onScroll, { passive: true });
  $("tabs").addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) setTab(b.dataset.tab); });
  $("scrim").addEventListener("click", closeSheet);

  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-act]"); if (!b) return;
    const a = b.dataset.act;
    if (a === "day") { viewDay = +b.dataset.n; renderAll(); }
    else if (a === "ex") exSheet(+b.dataset.i);
    else if (a === "close") closeSheet();
    else if (a === "set") {
      const e = entry(viewDay), s = +b.dataset.s, cur = e.sets[b.dataset.k] || 0;
      e.sets[b.dataset.k] = s < cur ? s : s + 1; save(); renderAll(); exSheet(+b.dataset.i);
      $("sheet").classList.add("on");
    }
    else if (a === "pain") { const e = entry(viewDay), v = +b.dataset.v; e.pain = e.pain === v ? null : v; save(); renderToday(); }
    else if (a === "jump-pain") $("painAnchor").scrollIntoView({ behavior: "smooth", block: "start" });
    else if (a === "stay1") { state.stayPhase1 = true; save(); renderAll(); }
    else if (a === "go2") { state.stayPhase1 = false; save(); renderAll(); }
    else if (a === "open") { viewDay = +b.dataset.n; setTab("today"); }
    else if (a === "train") { closeSheet(); startRun([+b.dataset.i]); }
    else if (a === "all") {
      const p = phaseFor(viewDay), e = entry(viewDay);
      const idx = p.list.map((x, i) => i).filter(i => (e.sets[p.list[i][0]] || 0) < p.list[i][2]);
      if (idx.length) startRun(idx);
    }
    else if (a === "rest") { S.rest = +b.dataset.s; save(); renderSet(); }
    else if (a === "ics") { if (S.remindOn || S.checkOn) addToCalendar(); }
    else if (a === "export") exportData();
    else if (a === "import") importSheet();
    else if (a === "import-go") importGo();
    else if (a === "reset") openSheet("清除全部记录", `<div class="note bad">${I.warn}<div class="bd">会删除 14 天的训练打卡、疼痛分数和备注，无法撤销。设置会保留。</div></div><div style="margin-top:16px;display:grid;gap:10px"><button class="btn" style="background:var(--red)" data-act="reset-go">清除全部记录</button><button class="btn tint" data-act="close">取消</button></div>`);
    else if (a === "reset-go") { state.log = {}; state.stayPhase1 = false; save(); closeSheet(); renderAll(); toast("已清除"); }
  });

  // ---------- follow-along runner ----------
  let R = null, audio = null, wake = null;
  function beep(freq = 880, dur = 0.12) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = freq; g.gain.setValueAtTime(0.18, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
      o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }
  function say(t) {
    if (!S.voice || !t) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "zh-CN"; u.rate = 1.05; speechSynthesis.speak(u); } catch (e) {}
  }
  function buildSteps(idxList) {
    const p = phaseFor(viewDay), e = entry(viewDay), steps = [];
    idxList.forEach((i, qi) => {
      const [k, reps, sets, dose] = p.list[i], ex = EX[k], from = Math.min(sets, e.sets[k] || 0) + 1;
      const meta = { k, i, sets, reps, dose };
      steps.push({ ...meta, label: qi ? `下一个：${ex.name}` : "准备", s: qi ? S.rest : 5, kind: "prep", set: from, say: `${qi ? "休息一下，下一个" : "准备"}，${ex.name}，${dose.replace("×", "乘")}` });
      if (ex.timed) { steps.push({ ...meta, label: "平地慢走", s: reps * 60, kind: "work", set: 1, rep: 0, finish: 1, say: "开始慢走，保持正常步幅" }); return; }
      for (let s = from; s <= sets; s++) {
        for (let r = 1; r <= reps; r++) ex.phases.forEach(([label, secs, kind], pi) => {
          if (kind === "rest" && r === reps) return;
          steps.push({ ...meta, label, s: secs, kind, set: s, rep: r, say: pi === 0 && r > 1 ? `${r}，${label}` : label });
        });
        for (let j = steps.length - 1; j >= 0; j--) if (steps[j].kind === "work") { steps[j].finish = s; break; }
        if (s < sets) steps.push({ ...meta, label: "组间休息", s: S.rest, kind: "rest", set: s + 1, rep: 0, say: `第${s}组完成，休息${S.rest}秒` });
      }
    });
    return steps;
  }
  function startRun(idxList) {
    const steps = buildSteps(idxList); if (!steps.length) return;
    R = { steps, idx: 0, left: 0, paused: false, day: viewDay, tick: null };
    $("timer").hidden = false; document.body.classList.add("locked");
    try { navigator.wakeLock && navigator.wakeLock.request("screen").then(w => wake = w).catch(() => {}); } catch (e) {}
    setPause(false); beep(660); enter();
    R.tick = setInterval(tick, 1000);
  }
  function enter() {
    const st = R.steps[R.idx], ex = EX[st.k];
    R.left = st.s;
    $("timer").className = "timer " + (st.kind === "work" ? "" : st.kind);
    $("tName").textContent = ex.name; $("tSub").textContent = st.dose;
    $("tCue").textContent = st.label;
    $("tDots").innerHTML = ex.timed ? "" : Array.from({ length: st.reps }, (_, r) => `<i class="${r < (st.kind === "work" ? st.rep : st.rep || 0) ? "on" : ""}"></i>`).join("");
    say(st.say);
    paint();
  }
  function paint() {
    const st = R.steps[R.idx];
    const big = R.left >= 60;
    $("tCount").textContent = big ? `${Math.floor(R.left / 60)}:${pad(R.left % 60)}` : R.left;
    $("tCount").style.fontSize = big ? "68px" : "";
    $("tArc").setAttribute("stroke-dashoffset", (282.7 * (1 - R.left / st.s)).toFixed(1));
    const ex = EX[st.k];
    $("tLine").innerHTML = ex.timed ? (st.kind === "prep" ? "目标 5–10 分钟" : `目标 <b>5–10</b> 分钟 · 感觉好可以多走，点「跳过」结束`)
      : st.kind === "prep" ? `从第 <b>${st.set}</b> 组开始，共 ${st.sets} 组`
      : st.kind === "rest" && !st.rep ? `下一组：第 <b>${st.set}</b>/${st.sets} 组`
      : `第 <b>${st.set}</b>/${st.sets} 组 · 第 <b>${st.rep}</b>/${st.reps} 次`;
  }
  function tick() {
    if (R.paused) return;
    R.left--;
    const st = R.steps[R.idx];
    if (R.left > 0 && R.left <= 3 && st.s >= 10) beep(520, .08);
    if (R.left <= 0) return advance();
    paint();
  }
  function advance() {
    const st = R.steps[R.idx];
    if (st.finish) { const e = entry(R.day); e.sets[st.k] = Math.max(e.sets[st.k] || 0, st.finish); save(); }
    R.idx++;
    if (R.idx >= R.steps.length) return finish(true);
    beep(R.steps[R.idx].kind === "work" ? 880 : 600); enter();
  }
  function finish(done) {
    clearInterval(R.tick);
    if (done) { beep(990, .3); say("完成了，记得记录训练后疼痛"); }
    else try { speechSynthesis.cancel(); } catch (e) {}
    R = null; $("timer").hidden = true; document.body.classList.remove("locked");
    try { wake && wake.release(); } catch (e) {} wake = null;
    renderAll();
    if (done) { toast("训练完成，记得记录疼痛"); }
  }
  function setPause(p) {
    R.paused = p;
    $("tPause").textContent = p ? "继续" : "暂停";
    $("tPause").className = "circ " + (p ? "go" : "pause");
    if (p) try { speechSynthesis.cancel(); } catch (e) {}
  }
  $("tPause").onclick = () => R && setPause(!R.paused);
  $("tSkip").onclick = () => R && advance();
  $("tStop").onclick = () => R && finish(false);

  // re-render when the app comes back to the foreground on a new day
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !R) { const d = clampDay(realDay()); if (renderAll.lastDay !== todayStr()) { viewDay = d; renderAll.lastDay = todayStr(); } renderAll(); } });
  renderAll.lastDay = todayStr();
  renderAll();

  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
