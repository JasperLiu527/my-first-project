<!doctype html>

<style>
/* Layout: iOS-style long-term rehab app — large title per tab, inset grouped lists, fixed translucent tab bar, bottom sheets and a full-screen workout timer */
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --card-2: #f2f2f7;
  --fg: #000000;
  --fg-2: rgba(60, 60, 67, .6);
  --fg-3: rgba(60, 60, 67, .3);
  --sep: rgba(60, 60, 67, .22);
  --fill: rgba(120, 120, 128, .12);
  --fill-2: rgba(120, 120, 128, .2);
  --bar: rgba(249, 249, 249, .86);
  --blue: #007aff;
  --green: #34c759;
  --orange: #ff9500;
  --red: #ff3b30;
  --teal: #30b0c7;
  --dim: rgba(0, 0, 0, .35);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", "Noto Sans SC", sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --card: #1c1c1e; --card-2: #2c2c2e; --fg: #ffffff;
    --fg-2: rgba(235, 235, 245, .6); --fg-3: rgba(235, 235, 245, .3); --sep: rgba(84, 84, 88, .55);
    --fill: rgba(120, 120, 128, .24); --fill-2: rgba(120, 120, 128, .36); --bar: rgba(22, 22, 24, .86);
    --blue: #0a84ff; --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --teal: #40c8e0; --dim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 17px; line-height: 1.35; letter-spacing: -.01em; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
body.locked { overflow: hidden; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.tabs, .strip, .scale, .ctrls { -webkit-user-select: none; user-select: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.r { font-family: var(--round); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

/* compact nav bar shown after scrolling past the large title */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 8; padding-top: env(safe-area-inset-top, 0px); background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: .5px solid var(--sep); opacity: 0; pointer-events: none; transition: opacity .2s; }
.nav.on { opacity: 1; pointer-events: auto; }
.nav div { height: 44px; display: grid; place-items: center; font-size: 17px; font-weight: 600; }

.wrap { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
.lt { padding-block: 20px 6px; display: grid; gap: 2px; }
.lt h1 { font-size: 34px; font-weight: 700; letter-spacing: .01em; }
.lt p { margin: 0; font-size: 15px; color: var(--fg-2); }
.view { display: grid; gap: 0; }

/* inset grouped list */
.gt { font-size: 13px; color: var(--fg-2); padding: 22px 16px 7px; letter-spacing: 0; }
.gt.big { font-size: 20px; font-weight: 700; color: var(--fg); padding: 26px 2px 8px; letter-spacing: .01em; }
.ft { font-size: 13px; color: var(--fg-2); padding: 7px 16px 0; line-height: 1.4; }
.group { background: var(--card); border-radius: 12px; overflow: hidden; }
.cell { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 11px 16px; position: relative; width: 100%; text-align: left; }
.cell + .cell::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); border-top: .5px solid var(--sep); }
.cell .main { flex: 1; min-width: 0; }
.cell .main .t { font-size: 17px; }
.cell .main .s { font-size: 13px; color: var(--fg-2); margin-top: 1px; }
.cell .val { color: var(--fg-2); font-size: 17px; white-space: nowrap; }
.cell.tap:active { background: var(--fill); }
.chev { width: 8px; height: 13px; flex: none; color: var(--fg-3); }
.ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; flex: none; color: #fff; }
.ico svg { width: 18px; height: 18px; }

/* switches and inputs */
.sw { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill-2); position: relative; flex: none; cursor: pointer; transition: background .2s; margin: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .2s; }
.sw:checked { background: var(--green); }
.sw:checked::after { transform: translateX(20px); }
.pick { font: inherit; font-size: 17px; color: var(--fg); background: var(--fill); border: 0; border-radius: 8px; padding: 5px 10px; min-height: 34px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { height: 30px; border-radius: 7px; font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); font-weight: 600; }
@media (prefers-color-scheme: dark) { .seg button[aria-pressed="true"] { background: #636366; } }
textarea { width: 100%; min-height: 72px; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 17px; resize: vertical; padding: 0; }
textarea::placeholder { color: var(--fg-3); }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px; border-radius: 12px; background: var(--blue); color: #fff; font-size: 17px; font-weight: 600; }
.btn:active { opacity: .8; }
.btn.tint { background: color-mix(in srgb, var(--blue) 15%, transparent); color: var(--blue); }
.btn.green { background: var(--green); }
.lnk { color: var(--blue); font-size: 17px; }
.lnk.red { color: var(--red); }

/* today: hero */
.hero { background: var(--card); border-radius: 16px; padding: 16px; display: grid; gap: 14px; }
.hero-top { display: flex; gap: 16px; align-items: center; }
.rings { width: 92px; height: 92px; flex: none; }
.hero-txt { flex: 1; min-width: 0; display: grid; gap: 6px; }
.hero-txt .k { font-size: 13px; color: var(--fg-2); font-weight: 600; letter-spacing: .02em; }
.legend { display: grid; gap: 3px; font-size: 15px; }
.legend b { font-family: var(--round); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.legend .a { color: var(--green); }
.legend .p { color: var(--teal); }

/* week strip */
.strip { display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 2px 10px; scrollbar-width: none; margin-inline: -2px; }
.strip::-webkit-scrollbar { display: none; }
.dc { flex: 0 0 calc((100% - 36px) / 7); scroll-snap-align: start; display: grid; justify-items: center; gap: 4px; padding: 6px 0 8px; border-radius: 12px; }
.dc .w { font-size: 11px; color: var(--fg-2); font-weight: 600; }
.dc .n { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; font-family: var(--round); font-weight: 600; font-size: 17px; position: relative; }
.dc .n svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.dc .d { font-size: 10px; color: var(--fg-3); }
.dc.sel { background: var(--card); }
.dc.sel .n { color: var(--blue); }
.dc.today .w { color: var(--red); }
.dc.future { opacity: .55; }
.phase-row { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 2px 6px; gap: 8px; }
.phase-row h2 { font-size: 20px; font-weight: 700; }
.phase-row span { font-size: 13px; color: var(--fg-2); }

/* exercise rows */
.ex { --inset: 104px; }
.thumb { width: 76px; height: 50px; border-radius: 9px; background: var(--card-2); flex: none; display: grid; place-items: center; color: var(--fg); }
.thumb svg { width: 70px; height: 44px; }
.prog { display: flex; align-items: center; gap: 6px; font-family: var(--round); font-size: 15px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.chk { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--fg-3); display: grid; place-items: center; flex: none; }
.chk.on { background: var(--green); border-color: var(--green); color: #fff; }
.chk.part { border-color: var(--orange); background: conic-gradient(var(--orange) var(--p), transparent 0); }
.chk svg { width: 14px; height: 14px; }

.note { border-radius: 12px; padding: 12px 14px; font-size: 15px; display: flex; gap: 10px; align-items: flex-start; background: var(--card); }
.note svg { width: 22px; height: 22px; flex: none; margin-top: 1px; }
.note .bd { flex: 1; min-width: 0; display: grid; gap: 6px; }
.note b { font-weight: 600; }
.note.warn svg { color: var(--orange); }
.note.bad svg { color: var(--red); }
.note.ok svg { color: var(--green); }
.note.info svg { color: var(--blue); }
.stack { display: grid; gap: 10px; margin-top: 12px; }

/* pain scale */
.pain { padding: 14px 16px 16px; display: grid; gap: 10px; }
.pain-head { display: flex; justify-content: space-between; align-items: baseline; }
.pain-head .big { font-family: var(--round); font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.pain-head .lab { font-size: 15px; color: var(--fg-2); }
.scale { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; }
.scale button { height: 36px; border-radius: 8px; background: var(--fill); font-family: var(--round); font-size: 15px; font-weight: 600; color: var(--fg-2); }
.scale button.on { color: #fff; }
.scale button.on.g { background: var(--green); }
.scale button.on.y { background: var(--orange); }
.scale button.on.r { background: var(--red); }
.scale-cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg-2); }

/* plan */
.pill { font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.pill.part { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
.pill.none { background: var(--fill); color: var(--fg-2); }
.pill.fut { color: var(--fg-3); }
.daynum { width: 36px; height: 36px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; font-family: var(--round); font-weight: 700; font-size: 17px; flex: none; }
.daynum.now { background: var(--blue); color: #fff; }

/* trends */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--card); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
.tile .k { font-size: 13px; font-weight: 600; }
.tile .v { font-family: var(--round); font-size: 34px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 17px; color: var(--fg-2); font-weight: 600; }
.tile .s { font-size: 12px; color: var(--fg-2); }
.chart-card { background: var(--card); border-radius: 14px; padding: 14px 14px 10px; display: grid; gap: 4px; }
.chart-card .k { font-size: 13px; font-weight: 600; color: var(--fg-2); }
.chart-card .t { font-size: 22px; font-weight: 700; }
.chart { width: 100%; height: auto; display: block; margin-top: 6px; }

/* guide */
.avoid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--sep); }
.avoid div { background: var(--card); padding: 14px 6px; text-align: center; font-size: 15px; display: grid; justify-items: center; gap: 4px; }
.avoid svg { width: 22px; height: 22px; color: var(--red); }
.bullet { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex: none; }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px max(4px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
.tabs button { display: grid; justify-items: center; gap: 2px; padding: 1px 0 2px; font-size: 10px; font-weight: 500; color: #999; letter-spacing: 0; }
.tabs svg { width: 26px; height: 26px; }
.tabs button[aria-selected="true"] { color: var(--blue); }

/* bottom sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--dim); opacity: 0; transition: opacity .25s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 600px; margin: 0 auto; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); overflow-y: auto; background: var(--bg); border-radius: 14px 14px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.sheet.on { transform: none; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--fg-3); margin: 0 auto 6px; }
.sheet-bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 0 10px; }
.sheet-bar h2 { font-size: 17px; font-weight: 600; }
.sheet-bar button { color: var(--blue); font-weight: 600; font-size: 17px; }
.illo { background: var(--card); border-radius: 14px; display: grid; place-items: center; padding: 12px; color: var(--fg); }
.illo svg { width: 100%; max-width: 320px; height: auto; }
.steps { margin: 0; padding: 0; list-style: none; }
.sn { width: 24px; height: 24px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; font-family: var(--round); font-size: 13px; font-weight: 700; flex: none; }

.stepper { display: flex; align-items: center; background: var(--fill); border-radius: 9px; height: 34px; flex: none; }
.stepper button { width: 46px; height: 34px; font-size: 22px; font-weight: 400; color: var(--fg); }
.stepper button:disabled { color: var(--fg-3); }
.stepper span { min-width: 64px; text-align: center; font-size: 15px; font-weight: 600; border-inline: .5px solid var(--sep); line-height: 22px; }

/* workout timer */
.timer { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; padding: calc(10px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
.timer-top { display: flex; justify-content: space-between; align-items: center; min-height: 44px; gap: 12px; }
.timer-top .ex-name { font-size: 17px; font-weight: 600; }
.timer-top .ex-sub { font-size: 13px; color: var(--fg-2); }
.timer-mid { display: grid; place-items: center; align-content: center; gap: 18px; text-align: center; }
.cue { font-size: 28px; font-weight: 700; min-height: 1.3em; }
.dial { position: relative; width: min(72vw, 300px); aspect-ratio: 1; max-width: 100%; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--round); font-weight: 300; font-size: 92px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.track { stroke: var(--fill); }
.arc { stroke: var(--blue); transition: stroke-dashoffset .3s linear; }
.timer.rest .arc { stroke: var(--green); }
.timer.prep .arc { stroke: var(--orange); }
.timer.rest .cue { color: var(--green); }
.timer.prep .cue { color: var(--orange); }
.tl { font-size: 17px; color: var(--fg-2); }
.tl b { font-family: var(--round); color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; max-width: 280px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--fill-2); }
.dots i.on { background: var(--blue); }
.ctrls { display: flex; justify-content: space-between; align-items: center; }
.circ { width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 500; position: relative; }
.circ::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 2px solid var(--bg); }
.circ.grey { background: var(--fill-2); }
.circ.go { background: color-mix(in srgb, var(--green) 25%, transparent); color: var(--green); }
.circ.pause { background: color-mix(in srgb, var(--orange) 25%, transparent); color: var(--orange); }
.skip { color: var(--blue); font-size: 17px; padding: 10px; }

.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: rgba(40,40,40,.92); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 15px; width: max-content; max-width: calc(100% - 40px); text-align: center; }

/* morning check */
.am { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.am button { height: 44px; border-radius: 10px; background: var(--fill); font-size: 15px; font-weight: 600; }
.am button.ok { color: var(--green); }
.am button.bad { color: var(--orange); }

/* month calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 8px 2px 16px; }
.cal-head h3 { font-size: 17px; font-weight: 600; }
.cal-head div { display: flex; }
.cal-head button { color: var(--blue); width: 40px; height: 40px; display: grid; place-items: center; }
.cal-head button svg { width: 10px; height: 17px; }
.cal-head button:disabled { color: var(--fg-3); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px 0; padding: 2px 6px 12px; text-align: center; }
.cal .wh { font-size: 12px; color: var(--fg-2); font-weight: 600; padding: 4px 0; }
.cal button { display: grid; justify-items: center; gap: 1px; padding: 3px 0; }
.cal .cn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--round); font-size: 16px; position: relative; }
.cal .cn svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.cal .today .cn { background: var(--red); color: #fff; font-weight: 600; }
.cal .pre { color: var(--fg-3); }
.cal .tag { font-size: 10px; color: var(--fg-2); height: 12px; line-height: 12px; }
.cal .tag.r { color: var(--teal); }

/* phases */
.ph-dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--round); font-weight: 700; font-size: 15px; flex: none; background: var(--fill); color: var(--fg-2); }
.ph-dot.now { background: var(--blue); color: #fff; }
.ph-dot.done { background: var(--green); color: #fff; }
.tagline { font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); white-space: nowrap; }
.crit { display: flex; gap: 10px; align-items: center; }
.crit i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; font-style: normal; font-size: 13px; font-weight: 700; color: #fff; }
.crit i.y { background: var(--green); }
.crit i.n { background: var(--orange); }
.crit i.u { background: var(--fill-2); color: var(--fg-2); }
.mini { font-size: 15px; color: var(--blue); font-weight: 500; white-space: nowrap; }
.del { color: var(--red); width: 30px; height: 30px; display: grid; place-items: center; flex: none; }
.del svg { width: 22px; height: 22px; }
.add { color: var(--green); }
.stepper.sm button { width: 34px; }
.stepper.sm span { min-width: 52px; font-size: 14px; }
.edit-row { flex-wrap: wrap; row-gap: 8px; }
.edit-row .ctl { display: flex; gap: 8px; flex-wrap: wrap; margin-left: 42px; width: 100%; }

@media (prefers-reduced-motion: reduce) { .sheet, .scrim, .arc, .nav, .sw, .sw::after { transition: none; } }
</style>
</head>

<div class="nav" id="nav" aria-hidden="true"><div id="navTitle">今天</div></div>

<main class="wrap">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-plan" hidden></section>
  <section class="view" id="v-trend" hidden></section>
  <section class="view" id="v-guide" hidden></section>
  <section class="view" id="v-set" hidden></section>

<script>
(() => {
  "use strict";
  // ---------- illustrations (simple line pictograms, 120×72) ----------
  const fig = body => `<svg viewBox="0 0 120 72" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="66" x2="116" y2="66" stroke-width="2" opacity=".25"></line>${body}</svg>`;
  const up = (x, y) => `<path d="M${x} ${y + 12}V${y}M${x - 4} ${y + 4}l4-4 4 4" stroke="var(--blue)" stroke-width="2.4"></path>`;
  const ILLO = {
    quad: fig(`<circle cx="14" cy="55" r="5.5"></circle><path d="M21 58H54L98 58l2-8"></path><ellipse cx="76" cy="62" rx="7" ry="3.5" stroke="var(--teal)" stroke-width="2.4"></ellipse><path d="M76 34v12M72 42l4 4 4-4" stroke="var(--blue)" stroke-width="2.4"></path>`),
    slr: fig(`<circle cx="14" cy="55" r="5.5"></circle><path d="M21 58H54L70 40L82 63"></path><path d="M54 58L98 38l3-7"></path>${up(106, 20)}`),
    side: fig(`<circle cx="14" cy="50" r="5.5"></circle><path d="M14 56l6 6"></path><path d="M21 54L54 58L100 60"></path><path d="M54 56L98 38"></path>${up(106, 22)}`),
    heel: fig(`<circle cx="14" cy="55" r="5.5"></circle><path d="M21 58H54L74 38L90 63"></path><path d="M80 50h22M84 46l-4 4 4 4M98 46l4 4-4 4" stroke="var(--blue)" stroke-width="2.4"></path>`),
    bridge: fig(`<circle cx="14" cy="59" r="5.5"></circle><path d="M21 61L54 44L74 36L84 63"></path>${up(52, 22)}`),
    sts: fig(`<path d="M18 40h24M20 40v24M40 40v24M18 40V14" stroke-width="2.6" opacity=".55"></path><circle cx="84" cy="12" r="5.5"></circle><path d="M84 18v22M84 40l-5 24M84 40l6 24M84 24l-7 12M84 24l7 12"></path>${up(60, 28)}`),
    walk: fig(`<circle cx="56" cy="12" r="5.5"></circle><path d="M56 18l2 22M58 40l-10 24M58 40l12 24M57 24l-9 12M57 24l10 10"></path><path d="M82 40h22M98 34l6 6-6 6" stroke="var(--blue)" stroke-width="2.4"></path>`),
    wallsit: fig(`<path d="M22 4v62" stroke-width="2.6" opacity=".55"></path><circle cx="31" cy="13" r="5.5"></circle><path d="M30 19v21L54 46l0 18M30 26l12 8"></path><path d="M66 34a20 20 0 0 0-10-9" stroke="var(--blue)" stroke-width="2" stroke-dasharray="3 3"></path>`),
    stepup: fig(`<rect x="52" y="52" width="40" height="14" rx="2" stroke-width="2.6" opacity=".55"></rect><circle cx="66" cy="10" r="5.5"></circle><path d="M66 16v20M66 36l8 8-2 8M66 36l-12 28M66 22l-8 10M66 22l8 10"></path>${up(100, 26)}`),
    bandwalk: fig(`<circle cx="60" cy="12" r="5.5"></circle><path d="M60 18v20M60 38l-12 26M60 38l12 26M60 24l-9 10M60 24l9 10"></path><path d="M52 54h16" stroke="var(--teal)" stroke-width="3"></path><path d="M18 40h18M22 36l-4 4 4 4M84 40h18M98 36l4 4-4 4" stroke="var(--blue)" stroke-width="2.4"></path>`),
    calf: fig(`<circle cx="60" cy="10" r="5.5"></circle><path d="M60 16v22M60 38l-4 20 3 6M60 38l4 20 3 6M60 22l-9 10M60 22l9 10"></path>${up(82, 34)}`),
    balance: fig(`<circle cx="60" cy="10" r="5.5"></circle><path d="M60 16v22M60 38v26M60 38l12 8-4 10M60 24l-16 6M60 24l16 6"></path>`)
  };

  // ---------- exercise library ----------
  const EX = {
    quad:  { name: "股四头肌等长收缩", short: "绷紧大腿，膝盖下压",
             steps: ["仰卧，左膝下垫一个毛巾卷", "绷紧大腿前侧肌肉，把膝盖向下压向毛巾", "保持 5 秒，然后放松 5 秒"],
             phases: [["绷紧，膝盖下压", 5, "work"], ["放松", 5, "rest"]] },
    slr:   { name: "仰卧直腿抬高", short: "膝盖伸直，抬高 20–30 cm",
             steps: ["仰卧，右腿屈膝踩地支撑", "左腿先绷紧大腿，保持膝盖伸直", "缓慢抬高 20–30 cm，顶端停留 1 秒", "缓慢放下，不要让腿掉下来"],
             phases: [["绷紧大腿，慢慢抬起", 3, "work"], ["顶端停留", 1, "work"], ["缓慢放下", 3, "work"], ["休息", 2, "rest"]] },
    side:  { name: "侧卧抬腿（臀中肌）", short: "侧卧，控制抬起不晃动",
             steps: ["右侧卧，左腿在上，膝盖伸直", "脚尖朝前，用臀部侧面发力", "缓慢抬高 20–30 cm，停留 1 秒", "控制着放下，身体不前后晃动"],
             phases: [["慢慢抬起", 3, "work"], ["停留", 1, "work"], ["缓慢放下", 3, "work"], ["休息", 2, "rest"]] },
    heel:  { name: "脚跟滑动屈膝", short: "舒适范围内屈伸",
             steps: ["仰卧，双腿伸直", "左脚跟沿床面缓慢滑向臀部", "到舒适位置后再慢慢滑回伸直", "不要强行深屈，不痛为准"],
             phases: [["脚跟滑向臀部", 4, "work"], ["慢慢伸直", 4, "work"], ["休息", 2, "rest"]] },
    bridge:{ name: "桥式（臀部）", short: "臀部发力抬起",
             steps: ["仰卧屈膝，双脚与髋同宽踩地", "臀部发力，抬起到肩、髋、膝一条线", "顶端停留 2 秒", "缓慢放下"],
             phases: [["臀部发力抬起", 2, "work"], ["顶端停留", 2, "work"], ["缓慢放下", 3, "work"], ["休息", 2, "rest"]] },
    sts:   { name: "高椅坐站", short: "控制膝盖方向，慢起慢坐",
             steps: ["选择较高的椅子，双脚与肩同宽", "身体前倾，慢慢站起", "再慢慢坐下，膝盖对准脚尖方向", "如疼痛明显，减少次数或暂停"],
             phases: [["慢慢站起", 3, "work"], ["慢慢坐下", 4, "work"], ["休息", 3, "rest"]] },
    walk:  { name: "平地慢走", short: "正常步幅，不加重疼痛", unit: "分钟",
             steps: ["在平地上慢走", "保持正常步幅，不要拖步", "如果疼痛或肿胀加重就停下"], timed: true },
    wallsit: { name: "靠墙静蹲（浅蹲）", short: "膝盖弯曲不超过 45°", unit: "次",
             steps: ["背靠墙站，双脚离墙约一脚半，与肩同宽", "沿墙慢慢下滑，膝盖只弯到 30–45°，不要蹲深", "膝盖对准脚尖，保持 20 秒", "慢慢站起休息；有疼痛就站高一点"],
             phases: [["下滑并保持", 20, "work"], ["站起休息", 20, "rest"]] },
    stepup: { name: "低台阶上台阶", short: "10–15 cm 低台阶，左腿发力",
             steps: ["面对一个 10–15 cm 高的低台阶，旁边扶墙", "左脚踩上台阶，左腿发力慢慢站上去", "右脚先下，左脚后下", "膝盖对准脚尖，不要内扣"],
             phases: [["左腿发力站上去", 3, "work"], ["慢慢下来", 3, "work"], ["休息", 2, "rest"]] },
    bandwalk: { name: "弹力带侧走", short: "微屈膝，向两侧横走", unit: "趟",
             steps: ["弹力带套在膝盖上方", "微微屈膝，上身保持直立", "向右横走 10 步，再向左走回来，算 1 趟", "膝盖不要内扣"],
             phases: [["向一侧横走 10 步", 12, "work"], ["走回来", 12, "work"], ["休息", 5, "rest"]] },
    calf:  { name: "提踵", short: "踮起脚尖再慢慢放下",
             steps: ["扶墙站立，双脚与髋同宽", "慢慢踮起脚尖，停留 1 秒", "缓慢放下", "轻松以后可以改成只用左脚"],
             phases: [["踮起", 2, "work"], ["停留", 1, "work"], ["慢慢放下", 2, "work"], ["休息", 1, "rest"]] },
    balance: { name: "单腿站立平衡", short: "左腿站稳 30 秒", unit: "次",
             steps: ["扶着椅背或墙边站好", "抬起右脚，用左腿单腿站立", "膝盖微屈不要锁死，保持 30 秒", "站稳以后可以松开手"],
             phases: [["左腿单腿站", 30, "work"], ["放下休息", 15, "rest"]] }
  };
  const unitOf = k => EX[k].unit || (EX[k].timed ? "分钟" : "次");

  // ---------- program: phases with exercises and entry criteria ----------
  const E = (k, reps, sets, max) => ({ k, reps, sets, max: max || reps });
  const DEFAULT_PROGRAM = [
    { id: "p1", name: "基础激活", time: "每天 10–15 分钟", minDays: 7, plan: true,
      desc: "以低负荷为主，恢复肌肉激活和关节活动度，让膝盖适应运动，不增加疼痛。",
      ex: [E("quad", 10, 2), E("slr", 8, 2), E("side", 10, 2), E("heel", 10, 1)] },
    { id: "p2", name: "力量提升", time: "每天 15–20 分钟", minDays: 7, plan: true,
      desc: "在第 1 阶段没有明显加重疼痛的前提下，逐步增加训练量，加入轻度负重动作。",
      ex: [E("quad", 10, 2), E("slr", 10, 2, 12), E("side", 10, 2, 12), E("bridge", 10, 2), E("sts", 5, 2, 8), E("walk", 5, 1, 10)] },
    { id: "p3", name: "巩固进阶", time: "每天 20–25 分钟", minDays: 28, confirm: true,
      desc: "加入单腿控制和轻负重，提高膝关节稳定性。动作和次数是常见的保守进阶建议，开始前请先和康复师确认。",
      ex: [E("slr", 12, 2, 15), E("bridge", 12, 2, 15), E("side", 12, 2, 15), E("sts", 8, 2, 12), E("wallsit", 5, 2, 8), E("stepup", 8, 2, 12), E("balance", 3, 1, 5), E("walk", 10, 1, 20)] },
    { id: "p4", name: "长期维持", time: "每周 3–4 次，每次 20–30 分钟", minDays: 0, confirm: true,
      desc: "保持力量和稳定性，逐步恢复日常活动。不练的日子标记为休息。跑跳、深蹲等运动恢复前先咨询医生。",
      ex: [E("bridge", 12, 2, 15), E("sts", 10, 2, 15), E("stepup", 10, 2, 15), E("wallsit", 6, 2, 10), E("balance", 4, 1, 6), E("calf", 15, 2, 20), E("bandwalk", 3, 2, 5), E("walk", 20, 1, 40)] }
  ];
  const clone = o => JSON.parse(JSON.stringify(o));

  // ---------- dates ----------
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const utc = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  const diffDays = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
  const WD = "日一二三四五六";
  const fmt = s => { const d = parse(s); return `${d.getMonth() + 1}月${d.getDate()}日 周${WD[d.getDay()]}`; };
  const fmtShort = s => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const todayStr = () => ymd(new Date());

  // ---------- state (same storage key as earlier versions; older data is migrated) ----------
  const LS = "knee14.v1";
  const DEFAULTS = { voice: true, rest: 30, remindOn: true, remindTime: "20:00", checkOn: true, checkTime: "09:00" };
  let state = { start: todayStr(), log: {}, updatedAt: 0, settings: {} };
  try { const s = JSON.parse(localStorage.getItem(LS) || "null"); if (s && s.start) state = Object.assign(state, s); } catch (e) {}
  function migrate() {
    state.settings = Object.assign({}, DEFAULTS, state.settings || {});
    if (state.v === 3) return;
    const prog = clone(DEFAULT_PROGRAM);
    // carry over reps adjusted in 2.1 ("1:slr" → phase 1, exercise slr)
    Object.entries(state.reps || {}).forEach(([key, v]) => {
      const [pk, k] = key.split(":"), ph = prog[+pk - 1], x = ph && ph.ex.find(x => x.k === k);
      if (x) x.reps = Math.min(x.max, v);
    });
    state.program = prog;
    // phase history: each entry means "from this date on, follow this phase"
    state.hist = [{ id: "p1", date: state.start }];
    if (diffDays(state.start, todayStr()) >= 7 && !state.stayPhase1) state.hist.push({ id: "p2", date: addDays(state.start, 7) });
    // "worse than yesterday" used to sit with the evening entry; it now belongs to the morning check
    Object.values(state.log).forEach(e => { if (e.worse) e.am = { worse: true, swell: !!e.swell }; delete e.worse; });
    delete state.reps; delete state.stayPhase1;
    state.v = 3;
  }
  migrate();
  const S = state.settings;
  function save() {
    state.updatedAt = Date.now();
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
  }
  save();

  // ---------- program helpers ----------
  const prog = () => state.program;
  const stintOf = date => { let h = state.hist[0]; state.hist.forEach(x => { if (x.date <= date) h = x; }); return h; };
  const phaseIndexOf = date => Math.max(0, prog().findIndex(p => p.id === stintOf(date).id));
  const phaseOf = date => prog()[phaseIndexOf(date)];
  const curIndex = () => phaseIndexOf(todayStr());
  const dayNo = date => diffDays(state.start, date) + 1;
  const phaseDay = date => diffDays(stintOf(date).date, date) + 1;
  function switchPhase(id) {
    const today = todayStr();
    state.hist = state.hist.filter((x, i) => i === 0 || x.date < today);
    if (state.hist.length === 1 && state.hist[0].date >= today) state.hist[0].id = id;
    else if (state.hist[state.hist.length - 1].id !== id) state.hist.push({ id, date: today });
    save();
  }
  const peek = date => state.log[date];
  const entry = date => state.log[date] || (state.log[date] = { sets: {}, pain: null, stairs: null, swell: false, note: "" });
  const flagged = e => !!e && ((e.pain ?? 0) > 2 || e.swell || (e.am && (e.am.worse || e.am.swell)));
  function completion(date) {
    const e = peek(date), p = phaseOf(date);
    const total = p.ex.reduce((a, x) => a + x.sets, 0);
    const done = e ? p.ex.reduce((a, x) => a + Math.min(x.sets, e.sets[x.k] || 0), 0) : 0;
    return { done, total, pct: total ? done / total : 0, rest: !!(e && e.rest) && done === 0 };
  }
  const doseText = x => EX[x.k].timed ? `${x.reps} 分钟` : `${x.reps} ${unitOf(x.k)} × ${x.sets} 组`;
  const planText = (p, x) => { const d = DEFAULT_PROGRAM.find(q => q.id === p.id); const o = d && d.ex.find(y => y.k === x.k); return o ? (o.max > o.reps ? `${o.reps}–${o.max} ${unitOf(x.k)}` : `${o.reps} ${unitOf(x.k)}`) + (EX[x.k].timed ? "" : ` × ${o.sets} 组`) : "自定义"; };

  // entry criteria for moving into phase i (checked against recent records)
  function lastDays(n) { const out = []; for (let i = 0; i < n; i++) out.push(addDays(todayStr(), -i)); return out; }
  function criteria(i) {
    const p = prog()[i], prev = prog()[i - 1];
    if (!prev) return [];
    const inPrev = curIndex() === i - 1 ? phaseDay(todayStr()) : 0;
    const win = i === 1 ? 3 : 7;
    const days = lastDays(win), es = days.map(peek).filter(Boolean);
    const pains = es.filter(e => e.pain != null).map(e => e.pain);
    const out = [];
    out.push({ t: `第 ${i} 阶段已练满 ${prev.minDays} 天（现在 ${Math.max(0, inPrev)} 天）`, ok: prev.minDays ? inPrev >= prev.minDays : true });
    out.push({ t: `最近 ${win} 天训练后疼痛都不超过 2 分`, ok: pains.length < Math.min(3, win) ? null : pains.every(v => v <= 2) });
    out.push({ t: `最近 ${win} 天没有肿胀、没有比前一天更痛`, ok: es.length ? !es.some(e => e.swell || (e.am && (e.am.worse || e.am.swell))) : null });
    if (i >= 2) {
      const st = lastDays(7).map(peek).filter(e => e && e.stairs != null).map(e => e.stairs);
      const lim = i === 2 ? 3 : 1;
      out.push({ t: `上楼疼痛降到 ${lim} 分以内${st.length ? `（最近 ${st[0]} 分）` : ""}`, ok: st.length ? st[0] <= lim : null });
    }
    if (p.confirm) out.push({ t: "已和康复师确认可以进入这个阶段", ok: null, confirm: true });
    return out;
  }

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const zone = v => v <= 2 ? "g" : v <= 4 ? "y" : "r";
  const zcol = v => v == null ? "var(--fg-3)" : v <= 2 ? "var(--green)" : v <= 4 ? "var(--orange)" : "var(--red)";
  const CHEV = `<svg class="chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5l5 5-5 5"></path></svg>`;
  const CHECK = `<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5l2.6 2.6L11 4.6"></path></svg>`;
  const I = {
    warn: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.7 0 1.3.4 1.7 1l8.4 15c.7 1.3-.2 3-1.7 3H3.6c-1.5 0-2.4-1.7-1.7-3l8.4-15c.4-.6 1-1 1.7-1zm0 6a1.2 1.2 0 0 0-1.2 1.3l.3 4.6a.9.9 0 0 0 1.8 0l.3-4.6A1.2 1.2 0 0 0 12 8.5zm0 8.2a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"></path></svg>`,

    bell: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5a6.5 6.5 0 0 1 6.5 6.5v3.6l1.6 3a1 1 0 0 1-.9 1.4H4.8a1 1 0 0 1-.9-1.4l1.6-3V9A6.5 6.5 0 0 1 12 2.5zm-2.6 16h5.2a2.6 2.6 0 0 1-5.2 0z"></path></svg>`,
    cal: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2.5a1 1 0 0 1 1 1V5h8V3.5a1 1 0 1 1 2 0V5h.5A2.5 2.5 0 0 1 21 7.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5v-11A2.5 2.5 0 0 1 5.5 5H6V3.5a1 1 0 0 1 1-1zM5 10v8.5c0 .3.2.5.5.5h13c.3 0 .5-.2.5-.5V10z"></path></svg>`,
    speak: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 4.5v15a1 1 0 0 1-1.7.7L5.6 16.5H3.5A1.5 1.5 0 0 1 2 15V9a1.5 1.5 0 0 1 1.5-1.5h2.1l3.7-3.7a1 1 0 0 1 1.7.7zm4.6 3a1 1 0 0 1 1.4 0 6.4 6.4 0 0 1 0 9 1 1 0 1 1-1.4-1.4 4.4 4.4 0 0 0 0-6.2 1 1 0 0 1 0-1.4z"></path></svg>`,
    timer: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 1.5h6a1 1 0 1 1 0 2h-2v1.1a8.5 8.5 0 1 1-2 0V3.5H9a1 1 0 0 1 0-2zm3 6a1 1 0 0 0-1 1V13a1 1 0 0 0 .4.8l2.5 1.9a1 1 0 0 0 1.2-1.6L13 12.5v-4a1 1 0 0 0-1-1z"></path></svg>`,
    box: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm0 6.5h16V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm5 2.5a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2z"></path></svg>`,
    trash: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.5 2.5h5a1 1 0 0 1 1 1V5H20a1 1 0 1 1 0 2h-1l-.9 12.6a2.5 2.5 0 0 1-2.5 2.4H8.4a2.5 2.5 0 0 1-2.5-2.4L5 7H4a1 1 0 0 1 0-2h4.5V3.5a1 1 0 0 1 1-1z"></path></svg>`,
    minus: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm-4.5 9a1 1 0 1 0 0 2h9a1 1 0 1 0 0-2z"></path></svg>`,
    plus: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 4.5a1 1 0 0 0-1 1V11H7.5a1 1 0 1 0 0 2H11v3.5a1 1 0 1 0 2 0V13h3.5a1 1 0 1 0 0-2H13V7.5a1 1 0 0 0-1-1z"></path></svg>`,
    reset: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 1-8.5 12 1 1 0 1 1 1.9-.7A7 7 0 1 0 6.6 7.5H9a1 1 0 0 1 0 2H4a1 1 0 0 1-1-1v-5a1 1 0 1 1 2 0v2.4A9 9 0 0 1 12 3z"></path></svg>`,
    play: `<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.9l12-7.4a1 1 0 0 0 0-1.8l-12-7.4A1 1 0 0 0 7 4.6z"></path></svg>`
  };
  const L_ARROW = `<svg viewBox="0 0 10 17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 1.5l-7 7 7 7"></path></svg>`;
  const R_ARROW = `<svg viewBox="0 0 10 17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5l7 7-7 7"></path></svg>`;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600);
  }
  function ringSvg(size, rings) {
    const c = size / 2;
    return `<svg viewBox="0 0 ${size} ${size}" class="rings" aria-hidden="true">${rings.map(g => {
      const L = 2 * Math.PI * g.r;
      return `<circle cx="${c}" cy="${c}" r="${g.r}" fill="none" stroke="${g.color}" stroke-opacity=".22" stroke-width="${g.w}"></circle>
        <circle cx="${c}" cy="${c}" r="${g.r}" fill="none" stroke="${g.color}" stroke-width="${g.w}" stroke-linecap="round" stroke-dasharray="${L.toFixed(2)}" stroke-dashoffset="${(L * (1 - Math.min(1, g.pct))).toFixed(2)}" transform="rotate(-90 ${c} ${c})" ${g.pct <= 0 ? 'stroke-opacity="0"' : ""}></circle>`;
    }).join("")}</svg>`;
  }
  const miniRing = (pct, rest, size = 34, r = 15) => {
    if (rest) return `<svg viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--teal)" stroke-width="2" stroke-dasharray="2 3"></circle></svg>`;
    if (pct <= 0) return "";
    const L = 2 * Math.PI * r;
    return `<svg viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${pct >= 1 ? "var(--green)" : "var(--orange)"}" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="${L.toFixed(1)}" stroke-dashoffset="${(L * (1 - pct)).toFixed(1)}"></circle></svg>`;
  };
  const scaleRow = (act, v) => `<div class="scale">${Array.from({ length: 11 }, (_, i) => `<button class="${v === i ? "on " : ""}${zone(i)}" data-act="${act}" data-v="${i}" aria-pressed="${v === i}" aria-label="${i} 分">${i}</button>`).join("")}</div>`;

  let viewDate = todayStr() < state.start ? state.start : todayStr();
  let tab = "today";
  let calMonth = viewDate.slice(0, 7);
  let trendRange = 14;

  // ---------- TODAY ----------
  function renderToday() {
    const today = todayStr(), isToday = viewDate === today, p = phaseOf(viewDate), pi = phaseIndexOf(viewDate);
    const e = entry(viewDate), c = completion(viewDate), dn = dayNo(viewDate);
    let h = `<header class="lt"><h1>${isToday ? "今天" : fmt(viewDate).split(" ")[0]}</h1><p>${fmt(viewDate)} · ${dn >= 1 ? `康复第 ${dn} 天` : "计划还没开始"}</p></header>`;

    // date strip: from up to 4 weeks back to 6 days ahead
    const from = [addDays(today, -27), state.start].sort()[1], to = addDays(today > state.start ? today : state.start, 6);
    h += `<div class="strip" id="strip">`;
    for (let d = from; d <= to; d = addDays(d, 1)) {
      const cc = completion(d), dd = parse(d);
      h += `<button class="dc${d === viewDate ? " sel" : ""}${d === today ? " today" : ""}${d > today ? " future" : ""}" data-act="day" data-d="${d}" aria-label="${fmt(d)}">
        <span class="w">${d === today ? "今天" : "周" + WD[dd.getDay()]}</span>
        <span class="n">${miniRing(cc.pct, cc.rest)}${dd.getDate()}</span>
        <span class="d">第${dayNo(d)}天</span></button>`;
    }
    h += `</div>`;

    // morning check: did yesterday's training make things worse?
    const yesterday = addDays(viewDate, -1), y = peek(yesterday);
    const amDue = isToday && !e.am && y && completion(yesterday).done > 0;
    if (amDue) {
      h += `<div class="note" style="margin-bottom:12px"><span style="color:var(--orange)">${I.sun}</span><div class="bd"><div><b>早上检查：</b>和昨天比，左膝怎么样？</div>
        <div class="am"><button class="ok" data-act="am" data-v="ok">没有加重</button><button class="bad" data-act="am" data-v="worse">更痛了</button><button class="bad" data-act="am" data-v="swell">肿了</button></div></div></div>`;
    }

    // hero
    const rec = (e.pain != null ? 1 : 0) + (e.stairs != null ? 1 : 0);
    h += `<div class="hero"><div class="hero-top">
        ${ringSvg(92, [{ pct: c.pct, color: "var(--green)", r: 39, w: 11 }, { pct: rec / 2, color: "var(--teal)", r: 25, w: 11 }])}
        <div class="hero-txt"><div class="k">第 ${pi + 1} 阶段 · ${p.name} · 第 ${phaseDay(viewDate)} 天</div>
          <div class="legend"><div class="a">训练 <b>${c.done}/${c.total}</b> 组</div><div class="p">感受记录 <b>${rec}/2</b></div></div>
        </div></div>
        ${c.rest ? `<button class="btn tint" data-act="unrest">已标记为休息日 · 撤销</button>`
          : c.pct >= 1 ? `<button class="btn tint" data-act="jump-pain">训练完成，记录感受</button>`
          : `<button class="btn" data-act="all">${I.play}${c.done ? "继续训练" : "开始训练"}</button>${c.done === 0 ? `<button class="lnk" style="font-size:15px" data-act="rest-day">今天休息，不训练</button>` : ""}`}
      </div>`;

    // notices
    const notes = [];
    const now = new Date(), [rh, rm] = S.remindTime.split(":").map(Number);
    if (isToday && c.pct < 1 && !c.rest && S.remindOn && (now.getHours() * 60 + now.getMinutes()) >= rh * 60 + rm)
      notes.push(`<div class="note info">${I.bell}<div class="bd"><div><b>该训练了。</b>今天还剩 ${c.total - c.done} 组。</div></div></div>`);
    if (e.am && (e.am.worse || e.am.swell))
      notes.push(`<div class="note warn">${I.warn}<div class="bd"><div><b>早上${e.am.swell ? "有肿胀" : "比昨天更痛"}。</b>今天降低负荷：在动作里把次数调少，或者少做一组；明显加重就休息一天。</div><button class="lnk" style="justify-self:start;font-size:15px" data-act="am-undo">重新选择</button></div></div>`);
    else if (y && ((y.pain ?? 0) > 2 || y.swell))
      notes.push(`<div class="note warn">${I.warn}<div class="bd"><div><b>前一天训练后疼痛 ${y.pain ?? "–"}/10${y.swell ? "，有肿胀" : ""}。</b>今天请降低负荷，动作幅度放小。</div></div></div>`);
    if (isToday && pi === curIndex() && prog()[pi + 1] && p.minDays && phaseDay(today) >= p.minDays) {
      const cr = criteria(pi + 1).filter(x => !x.confirm), allOk = cr.every(x => x.ok), miss = cr.some(x => x.ok === false);
      notes.push(`<div class="note ${allOk ? "ok" : "info"}">${allOk ? I.up : I.info}<div class="bd"><div><b>第 ${pi + 1} 阶段已满 ${p.minDays} 天。</b>${allOk ? `状态不错，可以考虑进入第 ${pi + 2} 阶段「${prog()[pi + 1].name}」。` : miss ? "还有条件没达到，建议继续本阶段。" : "有些条件还缺记录（比如上楼疼痛），记几天再看。"}</div><button class="lnk" style="justify-self:start;font-size:15px" data-act="phase" data-i="${pi + 1}">查看进阶条件</button></div></div>`);
    }
    if (dn < 1) notes.push(`<div class="note info">${I.info}<div class="bd"><div><b>计划从 ${fmt(state.start)} 开始。</b>可以先熟悉动作，开始日期在「设置」里修改。</div></div></div>`);
    if (notes.length) h += `<div class="stack">${notes.join("")}</div>`;

    // exercises
    const editable = pi === curIndex();
    h += `<div class="phase-row"><h2>训练动作</h2>${editable ? `<button class="mini" data-act="edit" data-i="${pi}">编辑</button>` : `<span>${p.time}</span>`}</div><div class="group">`;
    p.ex.forEach((x, i) => {
      const ex = EX[x.k], n = Math.min(x.sets, e.sets[x.k] || 0);
      const st = n >= x.sets ? `<span class="chk on">${CHECK}</span>` : n > 0 ? `<span class="chk part" style="--p:${(n / x.sets * 100).toFixed(0)}%"></span>` : `<span class="chk"></span>`;
      h += `<button class="cell tap ex" data-act="ex" data-i="${i}"><span class="thumb">${ILLO[x.k]}</span>
        <span class="main"><span class="t" style="display:block">${ex.name}</span><span class="s" style="display:block">${doseText(x)}</span></span>
        <span class="prog">${ex.timed ? "" : `${n}/${x.sets}`}${st}</span></button>`;
    });
    h += `</div><div class="ft">${p.time}。点动作查看做法、调整次数和打卡。</div>`;

    // feelings
    const pv = e.pain, sv = e.stairs;
    const painMsg = pv == null ? "训练后选择疼痛分数" : pv <= 2 ? "在目标范围内，保持" : pv <= 4 ? "超过 2 分：明天减少次数或组数" : "疼痛偏高：明天只做最轻松的动作，持续请就医";
    const base = firstStairs();
    const stairsMsg = sv == null ? `开始时是 5 分${base && base.date !== viewDate ? `，第一次记录 ${base.v} 分` : ""}` : sv <= 2 ? "很好，上楼基本不痛" : sv < 5 ? "比开始时（5 分）好转" : "和开始时差不多，继续坚持";
    h += `<div class="gt" id="painAnchor">今天的感受</div><div class="group">
      <div class="pain"><div class="pain-head"><span class="lab">训练后疼痛</span><span class="big" style="color:${zcol(pv)}">${pv == null ? "–" : pv}<small style="font-size:17px;color:var(--fg-2)"> /10</small></span></div>
        ${scaleRow("pain", pv)}<div class="scale-cap"><span>不痛</span><span>中等</span><span>剧痛</span></div>
        <div style="font-size:15px;color:${pv != null && pv > 2 ? zcol(pv) : "var(--fg-2)"}">${painMsg}</div></div>
      <div class="pain" style="border-top:.5px solid var(--sep)"><div class="pain-head"><span class="lab">上楼时疼痛</span><span class="big" style="color:${zcol(sv)}">${sv == null ? "–" : sv}<small style="font-size:17px;color:var(--fg-2)"> /10</small></span></div>
        ${scaleRow("stairs", sv)}<div style="font-size:15px;color:var(--fg-2)">${stairsMsg}</div></div>
      <label class="cell"><span class="main">出现肿胀</span><input type="checkbox" class="sw" id="swell" ${e.swell ? "checked" : ""}></label>
      <div class="cell"><textarea id="note" rows="2" placeholder="备注：哪个动作不舒服、今天走了多少路…">${esc(e.note || "")}</textarea></div>
    </div><div class="ft">目标：训练后疼痛 0–2 分，第二天不加重；上楼疼痛逐步从 5 分降下来。</div>`;

    $("v-today").innerHTML = h;
    $("swell").onchange = ev => { entry(viewDate).swell = ev.target.checked; save(); renderToday(); };
    $("note").oninput = ev => { entry(viewDate).note = ev.target.value; save(); };
    const sel = $("strip").querySelector(".sel");
    if (sel) $("strip").scrollLeft = Math.max(0, sel.offsetLeft - $("strip").clientWidth / 2 + sel.clientWidth / 2);
  }
  function firstStairs() {
    const d = Object.keys(state.log).sort().find(k => state.log[k].stairs != null);
    return d ? { date: d, v: state.log[d].stairs } : null;
  }

  // ---------- PLAN ----------
  function renderPlan() {
    const today = todayStr(), ci = curIndex();
    // month calendar
    const [yy, mm] = calMonth.split("-").map(Number);
    const first = new Date(yy, mm - 1, 1), daysIn = new Date(yy, mm, 0).getDate();
    const lead = (first.getDay() + 6) % 7;
    const minMonth = state.start.slice(0, 7), maxMonth = addDays(today, 31).slice(0, 7);
    let cal = `<div class="group"><div class="cal-head"><h3>${yy}年${mm}月</h3><div>
        <button data-act="mon" data-d="-1" ${calMonth <= minMonth ? "disabled" : ""} aria-label="上个月">${L_ARROW}</button>
        <button data-act="mon" data-d="1" ${calMonth >= maxMonth ? "disabled" : ""} aria-label="下个月">${R_ARROW}</button></div></div>
      <div class="cal">${"一二三四五六日".split("").map(w => `<div class="wh">${w}</div>`).join("")}${"<div></div>".repeat(lead)}`;
    for (let d = 1; d <= daysIn; d++) {
      const ds = `${yy}-${pad(mm)}-${pad(d)}`, before = ds < state.start;
      const cc = before ? null : completion(ds), e = peek(ds);
      const tag = before ? "" : cc.rest ? `<span class="tag r">休</span>` : e && e.pain != null ? `<span class="tag" style="color:${zcol(e.pain)}">${e.pain}分</span>` : `<span class="tag"></span>`;
      cal += `<button class="${ds === today ? "today" : ""}${before ? " pre" : ""}" ${before ? "disabled" : `data-act="open" data-d="${ds}"`} aria-label="${fmt(ds)}"><span class="cn">${before || ds === today ? "" : miniRing(cc.pct, cc.rest)}${d}</span>${tag}</button>`;
    }
    cal += `</div></div><div class="ft">圆环：绿色完成，橙色部分完成，虚线圈为休息日；下方数字是训练后疼痛。点日期可以补记。</div>`;

    let h = `<header class="lt"><h1>康复计划</h1><p>从 ${fmt(state.start)} 开始 · 今天是第 ${Math.max(1, dayNo(today))} 天</p></header>${cal}`;
    h += `<div class="gt big">阶段</div>`;

      const status = i < ci ? "done" : i === ci ? "now" : "";
      const range = i === ci ? `${fmtShort(stintOf(today).date)} 开始 · 第 ${phaseDay(today)} 天` : i < ci ? "已完成" : p.minDays ? `建议至少 ${p.minDays} 天` : "长期";
      h += `<div class="group" style="margin-bottom:12px"><div class="cell" style="align-items:flex-start;padding-top:14px">

          <span class="s" style="display:block">${range} · ${p.time}</span>
          <span class="s" style="display:block;margin-top:6px;font-size:15px;color:var(--fg)">${p.desc}</span></span></div>
        <div class="cell" style="--inset:58px;flex-wrap:wrap;gap:6px 6px;padding-left:58px">${p.ex.map(x => `<span class="pill none" style="color:var(--fg)">${EX[x.k].name} ${doseText(x)}</span>`).join("")}</div>
        ${i === ci ? `<button class="cell tap" style="--inset:58px;padding-left:58px" data-act="edit" data-i="${i}"><span class="main lnk">编辑这个阶段的动作</span>${CHEV}</button>` : ""}
        ${i === ci + 1 ? `<button class="cell tap" style="--inset:58px;padding-left:58px" data-act="phase" data-i="${i}"><span class="main lnk">查看进阶条件，进入这个阶段</span>${CHEV}</button>` : ""}
        ${i === ci && i > 0 ? `<button class="cell tap" style="--inset:58px;padding-left:58px" data-act="back"><span class="main lnk" style="color:var(--orange)">回到上一阶段</span>${CHEV}</button>` : ""}
      </div>`;
    });
    h += `<div class="ft">第 1、2 阶段来自你的康复计划；第 3、4 阶段是常见的保守进阶建议，开始前请和康复师确认，动作和次数都可以按康复师的要求修改。</div>`;
    $("v-plan").innerHTML = h;
  }

  // ---------- TRENDS ----------
  function renderTrend() {
    const today = todayStr();
    const from = [addDays(today, -(trendRange - 1)), state.start].sort()[1];
    const dates = []; for (let d = from; d <= today; d = addDays(d, 1)) dates.push(d);
    // stats
    let trained = 0, full = 0, over = 0, streak = 0; const pains = [];
    dates.forEach(d => { const c = completion(d), e = peek(d); if (c.done) trained++; if (c.pct >= 1) full++; if (e && e.pain != null) { pains.push(e.pain); if (e.pain > 2) over++; } });
    for (let d = today; d >= state.start; d = addDays(d, -1)) { const c = completion(d); if (c.done > 0 || c.rest) streak++; else if (d === today) continue; else break; }
    const avg = pains.length ? (pains.reduce((a, b) => a + b, 0) / pains.length).toFixed(1) : "–";
    const stairsAll = Object.keys(state.log).sort().filter(k => state.log[k].stairs != null).map(k => state.log[k].stairs);
    const stairsNow = stairsAll.length ? stairsAll[stairsAll.length - 1] : null;

    // chart buckets: daily up to 31 days, weekly beyond
    const weekly = dates.length > 31;
    const buckets = [];
    if (!weekly) dates.forEach(d => { const e = peek(d), c = completion(d); buckets.push({ label: fmtShort(d), pain: e && e.pain != null ? e.pain : null, stairs: e && e.stairs != null ? e.stairs : null, pct: d > today ? null : c.pct, rest: c.rest, today: d === today }); });
    else for (let i = 0; i < dates.length; i += 7) {
      const ds = dates.slice(i, i + 7), es = ds.map(peek).filter(Boolean);
      const av = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
      const cs = ds.map(completion);
      buckets.push({ label: fmtShort(ds[0]), pain: av(es.filter(e => e.pain != null).map(e => e.pain)), stairs: av(es.filter(e => e.stairs != null).map(e => e.stairs)),
        pct: cs.filter(c => c.done > 0 || c.rest).length / ds.length, rest: false, today: ds.includes(today) });
    }
    const W = 340, H = 200, Lp = 24, Rp = 10, T = 12, B = 46, n = buckets.length;
    const step = n > 1 ? (W - Lp - Rp) / (n - 1) : 0;
    const x = i => n > 1 ? Lp + step * i : (W + Lp - Rp) / 2, yv = v => T + (H - T - B) * (1 - v / 10);
    let g = `<rect x="${Lp}" y="${yv(2)}" width="${W - Lp - Rp}" height="${yv(0) - yv(2)}" fill="var(--green)" fill-opacity=".12"></rect>`;
    [0, 2, 5, 10].forEach(v => { g += `<line x1="${Lp}" x2="${W - Rp}" y1="${yv(v)}" y2="${yv(v)}" stroke="var(--sep)" stroke-width="1"></line><text x="${Lp - 6}" y="${yv(v) + 4}" text-anchor="end" font-size="10" fill="var(--fg-2)">${v}</text>`; });
    const line = (key, col) => {
      const pts = buckets.map((b, i) => b[key] == null ? null : [x(i), yv(b[key])]).filter(Boolean);
      let s = pts.length > 1 ? `<polyline points="${pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></polyline>` : "";
      if (n <= 31) s += pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.6" fill="${col}" stroke="var(--card)" stroke-width="1.5"></circle>`).join("");
      return s;
    };
    g += line("stairs", "var(--orange)") + line("pain", "var(--blue)");
    const bw = Math.max(3, Math.min(14, step * .7 || 14));
    buckets.forEach((b, i) => {
      const col = b.pct == null ? "var(--fill)" : b.rest ? "var(--teal)" : b.pct >= 1 ? "var(--green)" : b.pct > 0 ? "var(--orange)" : "var(--fill-2)";
      g += `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${H - 36}" width="${bw.toFixed(1)}" height="10" rx="2.5" fill="${col}"></rect>`;
    });
    const every = Math.ceil(n / 7);
    buckets.forEach((b, i) => { if (i % every === 0 || i === n - 1 && n < 8) g += `<text x="${x(i).toFixed(1)}" y="${H - 12}" text-anchor="middle" font-size="10" fill="${b.today ? "var(--red)" : "var(--fg-2)"}">${b.label}</text>`; });

    $("v-trend").innerHTML = `<header class="lt"><h1>趋势</h1><p>训练坚持情况和两种疼痛的变化</p></header>
      <div class="seg" style="margin:8px 0 12px">${[[14, "2 周"], [30, "1 个月"], [90, "3 个月"], [3650, "全部"]].map(([v, t]) => `<button data-act="range" data-v="${v}" aria-pressed="${trendRange === v}">${t}</button>`).join("")}</div>
      <div class="tiles">
        <div class="tile"><div class="k" style="color:var(--green)">训练天数</div><div class="v r">${trained}<small> /${dates.length}</small></div><div class="s">其中 ${full} 天全部完成</div></div>
        <div class="tile"><div class="k" style="color:var(--orange)">连续坚持</div><div class="v r">${streak}<small> 天</small></div><div class="s">休息日也算</div></div>
        <div class="tile"><div class="k" style="color:var(--blue)">平均训练后疼痛</div><div class="v r">${avg}<small> /10</small></div><div class="s">${over} 天超过 2 分</div></div>
        <div class="tile"><div class="k" style="color:var(--red)">上楼疼痛</div><div class="v r">${stairsNow ?? "–"}<small> /10</small></div><div class="s">开始时 5 分</div></div>
      </div>
      <div class="gt"></div>
      <div class="chart-card"><div class="k">疼痛变化${weekly ? "（每周平均）" : ""}</div>
        <div style="display:flex;gap:14px;font-size:13px;color:var(--fg-2);flex-wrap:wrap"><span><b style="color:var(--blue)">●</b> 训练后疼痛</span><span><b style="color:var(--orange)">●</b> 上楼疼痛</span></div>
        <svg class="chart r" viewBox="0 0 ${W} ${H}" role="img" aria-label="疼痛折线图和训练完成情况">${g}</svg>
        <div class="ft" style="padding:2px 0 4px">绿色区域是目标 0–2 分。下方方块：绿色完成，橙色部分完成，青色休息日${weekly ? "；每周方块的颜色深浅不区分" : ""}。</div>
      </div>`;
  }

  // ---------- calendar reminders (.ics) ----------
  function buildICS() {
    const first = (todayStr() > state.start ? todayStr() : state.start).replace(/-/g, "");
    const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    const url = location.href.split("#")[0];
    const ev = (uid, time, title, desc) => {
      const [hh, mm] = time.split(":");
      return ["BEGIN:VEVENT", `UID:${uid}-${first}-${hh}${mm}@knee-rehab`, `DTSTAMP:${stamp}`, `DTSTART:${first}T${hh}${mm}00`, "DURATION:PT15M",
        "RRULE:FREQ=DAILY", `SUMMARY:${title}`, `DESCRIPTION:${desc}`, `URL:${url}`,
        "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${title}`, "TRIGGER:PT0M", "END:VALARM", "END:VEVENT"].join("\r\n");
    };
    const evs = [];
    if (S.remindOn) evs.push(ev("train", S.remindTime, "左膝康复训练", "打开「左膝康复」App 完成今天的训练，记录训练后疼痛和上楼疼痛。"));
    if (S.checkOn) evs.push(ev("check", S.checkTime, "早上检查左膝：有没有比昨天更痛、更肿？", "打开「左膝康复」App 做早上检查。如果加重，今天降低训练负荷。"));
    return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//knee-rehab//CN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:左膝康复", ...evs, "END:VCALENDAR"].join("\r\n");
  }
  function addToCalendar() { location.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(buildICS()); }

  // ---------- backup ----------
  async function exportData() {
    const json = JSON.stringify(state);
    const name = `左膝康复备份-${todayStr()}.json`;
    try {
      const file = new File([json], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(json); toast("备份已复制，可以粘贴到备忘录保存"); }
    catch (e) { openSheet("导出备份", `<div class="group"><div class="cell"><textarea readonly rows="8" style="font-size:16px">${esc(json)}</textarea></div></div><div class="ft">长按全选并复制，保存到备忘录。</div>`); }
  }
  function importSheet() {
    openSheet("从备份恢复", `<div class="group"><div class="cell"><textarea id="impText" rows="7" placeholder="粘贴之前导出的备份内容" style="font-size:16px"></textarea></div></div>
      <div class="ft">也可以选择备份文件：</div><div class="group" style="margin-top:6px"><label class="cell tap"><span class="main lnk">选择文件…</span><input type="file" id="impFile" accept="application/json,.json,text/plain" hidden></label></div>
      <div style="margin-top:16px"><button class="btn" data-act="import-go">恢复，覆盖当前记录</button></div>`);
    $("impFile").onchange = ev => { const f = ev.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => $("impText").value = r.result; r.readAsText(f); };
  }
  function importGo() {
    try {
      const s = JSON.parse($("impText").value);
      if (!s || typeof s.start !== "string" || typeof s.log !== "object") throw 0;
      state = Object.assign({ log: {}, settings: {} }, s);
      migrate();
      Object.assign(S, state.settings); state.settings = S;
      viewDate = todayStr(); save(); closeSheet(); renderAll(); toast("已恢复");
    } catch (e) { toast("内容不是有效的备份，请检查后再试"); }
  }

  // ---------- sheets ----------
  function openSheet(title, body) {
    const sh = $("sheet"), sc = $("scrim");
    sh.innerHTML = `<div class="grab"></div><div class="sheet-bar"><span style="width:44px"></span><h2>${title}</h2><button data-act="close">完成</button></div>${body}`;
    const wasOpen = sh.classList.contains("on");
    sh.hidden = false; sc.hidden = false; document.body.classList.add("locked");
    if (wasOpen) return;
    requestAnimationFrame(() => { sh.classList.add("on"); sc.classList.add("on"); });
  }
  function closeSheet() {
    const sh = $("sheet"), sc = $("scrim");
    sh.classList.remove("on"); sc.classList.remove("on"); document.body.classList.remove("locked");
    setTimeout(() => { if (!sh.classList.contains("on")) { sh.hidden = true; sc.hidden = true; } }, 300);
  }
  const stepper = (act, attrs, val, label, min, max, sm) => `<div class="stepper${sm ? " sm" : ""}"><button data-act="${act}" ${attrs} data-d="-1" ${val <= min ? "disabled" : ""} aria-label="减少">−</button><span class="r">${label}</span><button data-act="${act}" ${attrs} data-d="1" ${val >= max ? "disabled" : ""} aria-label="增加">+</button></div>`;
  function exSheet(i) {
    const p = phaseOf(viewDate), x = p.ex[i], ex = EX[x.k], e = entry(viewDate), n = Math.min(x.sets, e.sets[x.k] || 0);
    const editable = phaseIndexOf(viewDate) === curIndex();
    openSheet(ex.name, `<div class="illo">${ILLO[x.k]}</div>
      <div class="gt">计划：${planText(p, x)} · ${p.time}</div>
      ${editable ? `<div class="group"><div class="cell"><span class="main"><span class="t" style="display:block">${ex.timed ? "时长" : "每组" + unitOf(x.k) + "数"}</span><span class="s" style="display:block">${x.reps < (DEFAULT_PROGRAM.find(q => q.id === p.id)?.ex.find(y => y.k === x.k)?.reps ?? 0) ? "已减量，膝盖舒服后再加回来" : "疼痛超过 2 分时可以减少"}</span></span>
        ${stepper("reps", `data-i="${i}"`, x.reps, `${x.reps} ${unitOf(x.k)}`, 3, x.max)}</div></div>` : ""}
      <div class="gt">做法</div><div class="group" style="--inset:52px"><ol class="steps">${ex.steps.map((s, j) => `<li class="cell"><span class="sn">${j + 1}</span><span class="main">${s}</span></li>`).join("")}</ol></div>
      <div class="gt">打卡 · ${fmt(viewDate)}</div><div class="group">${Array.from({ length: x.sets }, (_, s) => `<button class="cell tap" data-act="set" data-k="${x.k}" data-s="${s}" data-i="${i}"><span class="main">${ex.timed ? "已完成" : `第 ${s + 1} 组`}</span><span class="chk${s < n ? " on" : ""}">${s < n ? CHECK : ""}</span></button>`).join("")}</div>
      <div style="margin-top:16px"><button class="btn" data-act="train" data-i="${i}">${I.play}${ex.timed ? "开始计时" : "开始跟练"}</button></div>`);
  }
  function editSheet(pi) {
    const p = prog()[pi];
    const rows = p.ex.map((x, i) => `<div class="cell edit-row" style="--inset:58px">
        <button class="del" data-act="ex-del" data-p="${pi}" data-i="${i}" aria-label="删除 ${EX[x.k].name}">${I.minus}</button>
        <span class="main"><span class="t" style="display:block">${EX[x.k].name}</span><span class="s" style="display:block">计划 ${planText(p, x)}</span></span>
        <div class="ctl">${stepper("ed-reps", `data-p="${pi}" data-i="${i}"`, x.reps, `${x.reps} ${unitOf(x.k)}`, 3, 60, true)}${EX[x.k].timed ? "" : stepper("ed-sets", `data-p="${pi}" data-i="${i}"`, x.sets, `${x.sets} 组`, 1, 4, true)}</div></div>`).join("");
    const add = Object.keys(EX).filter(k => !p.ex.some(x => x.k === k)).map(k => `<button class="cell tap" style="--inset:58px" data-act="ex-add" data-p="${pi}" data-k="${k}"><span class="del add">${I.plus}</span><span class="main"><span class="t" style="display:block">${EX[k].name}</span><span class="s" style="display:block">${EX[k].short}</span></span></button>`).join("");
    openSheet(`编辑「${p.name}」`, `<div class="gt">当前动作</div><div class="group">${rows || `<div class="cell"><span class="main" style="color:var(--fg-2)">还没有动作</span></div>`}</div>
      <div class="ft">按康复师的要求调整。次数超过计划上限时请先确认。</div>
      ${add ? `<div class="gt">添加动作</div><div class="group">${add}</div>` : ""}
      <div style="margin-top:16px"><button class="btn tint" data-act="ph-reset" data-p="${pi}">恢复这个阶段的默认设置</button></div>`);
  }
  function phaseSheet(i) {
    const p = prog()[i], cr = criteria(i);
    const mark = ok => ok === true ? `<i class="y">✓</i>` : ok === false ? `<i class="n">!</i>` : `<i class="u">?</i>`;
    openSheet(`第 ${i + 1} 阶段：${p.name}`, `<div class="note">${p.plan ? I.info : I.warn}<div class="bd">${p.desc}</div></div>
      <div class="gt">进阶条件</div><div class="group">${cr.map(c => c.confirm
        ? `<label class="cell"><span class="crit"><input type="checkbox" class="sw" id="confirmCk" style="transform:scale(.8);margin:-4px -6px"></span><span class="main">${c.t}</span></label>`
        : `<div class="cell"><span class="crit">${mark(c.ok)}</span><span class="main">${c.t}</span></div>`).join("")}</div>
      <div class="ft">绿色已达到，橙色未达到，灰色是记录不够、无法判断。条件没全部达到时，建议继续当前阶段。</div>
      <div class="gt">这个阶段的动作</div><div class="group ex">${p.ex.map(x => `<div class="cell"><span class="thumb">${ILLO[x.k]}</span><span class="main"><span class="t" style="display:block">${EX[x.k].name}</span><span class="s" style="display:block">${doseText(x)} · ${EX[x.k].short}</span></span></div>`).join("")}</div>
      <div style="margin-top:16px;display:grid;gap:10px"><button class="btn" data-act="ph-go" data-i="${i}">从今天开始第 ${i + 1} 阶段</button><button class="btn tint" data-act="close">先不进入</button></div>`);
  }
  function enterPhase(i) {
    const p = prog()[i];
    if (p.confirm && !($("confirmCk") && $("confirmCk").checked)) return toast("请先确认已经和康复师沟通过");
    const today = todayStr();
    switchPhase(p.id);
    closeSheet(); viewDate = today; setTab("today"); toast(`已进入第 ${i + 1} 阶段：${p.name}`);
  }

  // ---------- tabs & render ----------
  const TITLES = { today: "今天", plan: "康复计划", trend: "趋势", guide: "须知", set: "设置" };
  function renderAll() {
    ({ today: renderToday, plan: renderPlan, trend: renderTrend, guide: renderGuide, set: renderSet })[tab]();
    $("navTitle").textContent = tab === "today" && viewDate !== todayStr() ? fmt(viewDate) : TITLES[tab];
  }
  function setTab(t) {
    tab = t;
    document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
    Object.keys(TITLES).forEach(v => $("v-" + v).hidden = v !== t);
    renderAll(); window.scrollTo(0, 0); onScroll();
  }
  function onScroll() { $("nav").classList.toggle("on", window.scrollY > 44); }
  window.addEventListener("scroll", onScroll, { passive: true });
  $("tabs").addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) setTab(b.dataset.tab); });
  $("scrim").addEventListener("click", closeSheet);

  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
    const a = b.dataset.act, d = +b.dataset.d;
    if (a === "day") { viewDate = b.dataset.d; renderAll(); }
    else if (a === "ex") exSheet(+b.dataset.i);
    else if (a === "close") closeSheet();
    else if (a === "set") {
      const e = entry(viewDate), s = +b.dataset.s, cur = e.sets[b.dataset.k] || 0;
      e.sets[b.dataset.k] = s < cur ? s : s + 1; delete e.rest; save(); renderAll(); exSheet(+b.dataset.i);
    }
    else if (a === "reps") { const x = phaseOf(viewDate).ex[+b.dataset.i]; x.reps = Math.max(3, Math.min(x.max, x.reps + d)); save(); renderAll(); exSheet(+b.dataset.i); }
    else if (a === "pain" || a === "stairs") { const e = entry(viewDate), v = +b.dataset.v; e[a] = e[a] === v ? null : v; save(); renderToday(); }
    else if (a === "am") { const v = b.dataset.v; entry(viewDate).am = { worse: v === "worse", swell: v === "swell" }; save(); renderToday(); }
    else if (a === "am-undo") { delete entry(viewDate).am; save(); renderToday(); }
    else if (a === "rest-day") { entry(viewDate).rest = true; save(); renderToday(); toast("已标记休息，好好放松"); }
    else if (a === "unrest") { delete entry(viewDate).rest; save(); renderToday(); }
    else if (a === "jump-pain") $("painAnchor").scrollIntoView({ behavior: "smooth", block: "start" });
    else if (a === "open") { viewDate = b.dataset.d; setTab("today"); }
    else if (a === "mon") { const [yy, mm] = calMonth.split("-").map(Number), dt = new Date(yy, mm - 1 + d, 1); calMonth = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}`; renderPlan(); }
    else if (a === "range") { trendRange = +b.dataset.v; renderTrend(); }
    else if (a === "edit") editSheet(+b.dataset.i);
    else if (a === "ed-reps" || a === "ed-sets") {
      const pi = +b.dataset.p, x = prog()[pi].ex[+b.dataset.i];
      if (a === "ed-reps") { x.reps = Math.max(3, Math.min(60, x.reps + d)); x.max = Math.max(x.max, x.reps); }
      else x.sets = Math.max(1, Math.min(4, x.sets + d));
      save(); renderAll(); editSheet(pi);
    }
    else if (a === "ex-del") { const pi = +b.dataset.p; prog()[pi].ex.splice(+b.dataset.i, 1); save(); renderAll(); editSheet(pi); }
    else if (a === "ex-add") {
      const pi = +b.dataset.p, k = b.dataset.k;
      const ref = DEFAULT_PROGRAM.flatMap(p => p.ex).find(x => x.k === k);
      prog()[pi].ex.push(ref ? clone(ref) : E(k, 10, 2)); save(); renderAll(); editSheet(pi);
    }
    else if (a === "ph-reset") { const pi = +b.dataset.p; prog()[pi] = clone(DEFAULT_PROGRAM[pi]); save(); renderAll(); editSheet(pi); toast("已恢复默认"); }
    else if (a === "phase") phaseSheet(+b.dataset.i);
    else if (a === "ph-go") enterPhase(+b.dataset.i);
    else if (a === "back") openSheet("回到上一阶段", `<div class="note warn">${I.warn}<div class="bd">从今天起改回第 ${curIndex()} 阶段「${prog()[curIndex() - 1].name}」。疼痛反复时退回去练一段时间很正常。</div></div><div style="margin-top:16px;display:grid;gap:10px"><button class="btn" data-act="back-go">回到上一阶段</button><button class="btn tint" data-act="close">取消</button></div>`);
    else if (a === "back-go") { switchPhase(prog()[curIndex() - 1].id); closeSheet(); renderAll(); toast("已回到上一阶段"); }
    else if (a === "reset-plan") openSheet("恢复默认", `<div class="note">${I.info}<div class="bd">所有阶段的动作、次数和组数改回默认值。训练记录和当前阶段不变。</div></div><div style="margin-top:16px;display:grid;gap:10px"><button class="btn" data-act="reset-plan-go">恢复默认</button><button class="btn tint" data-act="close">取消</button></div>`);
    else if (a === "reset-plan-go") { state.program = clone(DEFAULT_PROGRAM); save(); closeSheet(); renderAll(); toast("已恢复默认"); }
    else if (a === "train") { closeSheet(); startRun([+b.dataset.i]); }
    else if (a === "all") {
      const p = phaseOf(viewDate), e = entry(viewDate);
      const idx = p.ex.map((x, i) => i).filter(i => (e.sets[p.ex[i].k] || 0) < p.ex[i].sets);
      if (idx.length) startRun(idx);
    }
    else if (a === "rest") { S.rest = +b.dataset.s; save(); renderSet(); }
    else if (a === "ics") { if (S.remindOn || S.checkOn) addToCalendar(); }
    else if (a === "export") exportData();
    else if (a === "import") importSheet();
    else if (a === "import-go") importGo();
    else if (a === "reset") openSheet("清除全部记录", `<div class="note bad">${I.warn}<div class="bd">会删除所有训练打卡、疼痛分数和备注，无法撤销。设置、动作和当前阶段会保留。</div></div><div style="margin-top:16px;display:grid;gap:10px"><button class="btn" style="background:var(--red)" data-act="reset-go">清除全部记录</button><button class="btn tint" data-act="close">取消</button></div>`);
    else if (a === "reset-go") { state.log = {}; save(); closeSheet(); renderAll(); toast("已清除"); }
  });

  // ---------- follow-along runner ----------
  let R = null, audio = null, wake = null;
  function beep(freq = 880, dur = 0.12) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = freq; g.gain.setValueAtTime(0.18, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
      o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }
  function say(t) {
    if (!S.voice || !t) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "zh-CN"; u.rate = 1.05; speechSynthesis.speak(u); } catch (e) {}
  }
  function buildSteps(idxList) {
    const p = phaseOf(viewDate), e = entry(viewDate), steps = [];
    idxList.forEach((i, qi) => {
      const x = p.ex[i], k = x.k, reps = x.reps, sets = x.sets, ex = EX[k], from = Math.min(sets, e.sets[k] || 0) + 1;
      const meta = { k, i, sets, reps, dose: doseText(x) };
      steps.push({ ...meta, label: qi ? `下一个：${ex.name}` : "准备", s: qi ? S.rest : 5, kind: "prep", set: from, say: `${qi ? "休息一下，下一个" : "准备"}，${ex.name}，${ex.timed ? reps + "分钟" : reps + unitOf(k) + "，" + (sets - from + 1) + "组"}` });
      if (ex.timed) { steps.push({ ...meta, label: ex.name, s: reps * 60, kind: "work", set: 1, rep: 0, finish: 1, say: "开始，保持正常步幅" }); return; }
      for (let s = from; s <= sets; s++) {
        for (let r = 1; r <= reps; r++) ex.phases.forEach(([label, secs, kind], pi) => {
          if (kind === "rest" && r === reps) return;
          steps.push({ ...meta, label, s: secs, kind, set: s, rep: r, say: pi === 0 && r > 1 ? `${r}，${label}` : label });
        });
        for (let j = steps.length - 1; j >= 0; j--) if (steps[j].kind === "work") { steps[j].finish = s; break; }
        if (s < sets) steps.push({ ...meta, label: "组间休息", s: S.rest, kind: "rest", set: s + 1, rep: 0, say: `第${s}组完成，休息${S.rest}秒` });
      }
    });
    return steps;
  }
  function startRun(idxList) {
    const steps = buildSteps(idxList); if (!steps.length) return;
    R = { steps, idx: 0, left: 0, end: 0, remain: 0, lastBeep: -1, paused: false, date: viewDate, tick: null };
    $("timer").hidden = false; document.body.classList.add("locked");
    keepAwake();
    setPause(false); beep(660); enter(Date.now());
    R.tick = setInterval(tick, 250);
  }
  function keepAwake() {
    try { navigator.wakeLock && navigator.wakeLock.request("screen").then(w => wake = w).catch(() => {}); } catch (e) {}
  }
  // each step has an absolute end time, so the count stays right even if the phone locks or the app is in the background
  function enter(at) {
    const st = R.steps[R.idx], ex = EX[st.k];
    R.left = st.s; R.end = at + st.s * 1000; R.lastBeep = -1;
    $("timer").className = "timer " + (st.kind === "work" ? "" : st.kind);
    $("tName").textContent = ex.name; $("tSub").textContent = st.dose;
    $("tCue").textContent = st.label;
    $("tDots").innerHTML = ex.timed || st.reps > 20 ? "" : Array.from({ length: st.reps }, (_, r) => `<i class="${r < (st.rep || 0) ? "on" : ""}"></i>`).join("");
    say(st.say);
    paint();
  }
  function paint() {
    const st = R.steps[R.idx];
    const big = R.left >= 60;
    $("tCount").textContent = big ? `${Math.floor(R.left / 60)}:${pad(R.left % 60)}` : R.left;
    $("tCount").style.fontSize = big ? "68px" : "";
    $("tArc").setAttribute("stroke-dashoffset", (282.7 * (1 - R.left / st.s)).toFixed(1));
    const ex = EX[st.k], u = unitOf(st.k);
    $("tLine").innerHTML = ex.timed ? (st.kind === "prep" ? `计划 ${st.reps} 分钟` : `计划 <b>${st.reps}</b> 分钟 · 走完了可以点「跳过」结束`)
      : st.kind === "prep" ? `从第 <b>${st.set}</b> 组开始，共 ${st.sets} 组`
      : st.kind === "rest" && !st.rep ? `下一组：第 <b>${st.set}</b>/${st.sets} 组`
      : `第 <b>${st.set}</b>/${st.sets} 组 · 第 <b>${st.rep}</b>/${st.reps} ${u}`;
  }
  function tick() {
    if (!R || R.paused) return;
    const now = Date.now();
    let guard = 0;
    while (R && now >= R.end && guard++ < 2000) advance(R.end);
    if (!R) return;
    const left = Math.ceil((R.end - now) / 1000);
    if (left === R.left) return;
    R.left = left;
    const st = R.steps[R.idx];
    if (left > 0 && left <= 3 && st.s >= 10 && R.lastBeep !== left) { R.lastBeep = left; beep(520, .08); }
    paint();
  }
  function advance(at) {
    const st = R.steps[R.idx];
    if (st.finish) { const e = entry(R.date); e.sets[st.k] = Math.max(e.sets[st.k] || 0, st.finish); delete e.rest; save(); }
    R.idx++;
    if (R.idx >= R.steps.length) return finish(true);
    beep(R.steps[R.idx].kind === "work" ? 880 : 600); enter(at || Date.now());
  }
  function finish(done) {
    clearInterval(R.tick);
    if (done) { beep(990, .3); say("完成了，记得记录今天的感受"); }
    else try { speechSynthesis.cancel(); } catch (e) {}
    const date = R.date;
    R = null; $("timer").hidden = true; document.body.classList.remove("locked");
    try { wake && wake.release(); } catch (e) {} wake = null;
    renderAll();
    if (done) {
      toast("训练完成，记得记录感受");
      if (tab === "today" && peek(date) && peek(date).pain == null) setTimeout(() => { const a = $("painAnchor"); a && a.scrollIntoView({ behavior: "smooth", block: "start" }); }, 400);
    }
  }
  function setPause(p) {
    if (p && !R.paused) R.remain = Math.max(0, R.end - Date.now());
    if (!p && R.paused) R.end = Date.now() + R.remain;
    R.paused = p;
    $("tPause").textContent = p ? "继续" : "暂停";
    $("tPause").className = "circ " + (p ? "go" : "pause");
    if (p) try { speechSynthesis.cancel(); } catch (e) {}
  }
  $("tPause").onclick = () => R && setPause(!R.paused);
  $("tSkip").onclick = () => { if (R) { if (R.paused) setPause(false); advance(Date.now()); } };
  $("tStop").onclick = () => R && finish(false);

  // back in the foreground: keep the timer honest, and jump to the new day if the date changed
  let lastDay = todayStr();
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    if (R) { keepAwake(); tick(); return; }
    if (lastDay !== todayStr()) { if (viewDate === lastDay) viewDate = todayStr(); lastDay = todayStr(); }
    renderAll();
  });
  renderAll();

  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
